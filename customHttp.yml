# Response headers for the Amplify deployment. A file here replaces any custom
# headers set in the Amplify console, so it carries the full set.
customHeaders:
  - pattern: "**/*"
    headers:
      - key: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-XSS-Protection
        value: 1; mode=block
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
  # The Markdown version of each doc (src/pages/docs/[version]/[...slug].md.ts)
  # duplicates its page, so keep it out of search results. Crawlers and agents
  # can still fetch it. The charset is for browsers: the files have emoji and
  # curly quotes, and nosniff stops a browser from working out the encoding.
  - pattern: "**/*.md"
    headers:
      - key: X-Robots-Tag
        value: noindex
      - key: Content-Type
        value: text/markdown; charset=utf-8
