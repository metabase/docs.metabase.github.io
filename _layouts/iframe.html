<!DOCTYPE html>
<html lang="en-US">

  {% include head.html %}

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    html {
      height: -webkit-fill-available;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding-top: 72px;
    }

    .iframe-container {
      align-items: flex-start;
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      height: 100vh;
      height: -webkit-fill-available;
      justify-content: flex-start;
      overflow: hidden;
      position: relative;
      vertical-align: bottom;
      width: 100%;
    }

    .iframe-container > iframe {
      border: none;
      flex: 1 0 auto;
      height: 100%;
      margin: 0 auto;
      padding: 0;
      position: relative;
      vertical-align: bottom;
      width: 100%;
    }
  </style>


  <body>

    {% include header.html %}
    <div class="iframe-container">
      {{ content }}
    </div>
    {% include footer.html color=true %}
  </body>

  <script type="text/javascript" src="/gdpr-cookie-notice/dist/script.js"></script>
  <script type="text/javascript" src="/js/cookie-consent.js"></script>

</html>
