<!-- An iframe is needed for this form to allow rendering of multiple mailchimp forms -->

<iframe
    id="post-signup-form-{{include.id}}"
    src="/post-signup-form.html"
    width="100%"
    height="200px"
    onload="javascript:(function(o){
        o.style.height=o.contentWindow.document.getElementById('mc_embed_signup').offsetHeight+'px';

        const resizeObserver = new ResizeObserver(function(entries) {
            const $firstEntry = entries[0];
            if ($firstEntry && $firstEntry.borderBoxSize && $firstEntry.borderBoxSize[0]) {
                const $form = $firstEntry.borderBoxSize[0];
                if ($form) {
                    o.style.height = $form.blockSize + 'px';
                }
            }
        });
        resizeObserver.observe(o.contentWindow.document.getElementById('mc_embed_signup'));
    }(this));"
    style="border:none;overflow:hidden;"></iframe>
