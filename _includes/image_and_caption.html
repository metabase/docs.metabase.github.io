<figure class="image {{ include.css }}">

    {% if include.url_md %}
    <img class="image__img image__img--md" src="{{ include.url_md }}" alt="{{ include.description }}" loading="lazy" />
    {% endif %}

    <img class="image__img" src="{{ include.url }}" alt="{{ include.description }}" loading="lazy" />

    <figcaption>{{ include.description }}</figcaption>

</figure>
