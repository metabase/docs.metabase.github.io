<div class="top-bar">
  <div>
    {% if include.show_breadcrumb %}
      <div class="learn-breadcrumb-trail">
        {% if include.domain == "docs" %}
          {% include docs_breadcrumb.html %}
        {% else %}
          {% include learn/breadcrumbs.html %}
        {% endif %}
      </div>
    {% endif %}
  </div>

  <div>
    {% unless include.show_search == "false" %}
      {% include learn/search-input.html domain=include.domain %}
    {% endunless %}
  </div>
</div>
