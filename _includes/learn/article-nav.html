{% unless article.hide_nav == "true" %}
  {% unless page.url contains "learn-search" %}
    {% if next_page %}
      <a href="{{next_page.url}}" class="learn__article__nav">
        <h5>Next: {{ next_page.name }}</h5>
        <p>{{ next_page.summary }}</p>
        <div>
          Next article {% include svg-icons/arrow-right.html %}

        </div>
      </a>
    {% endif %}
  {% endunless %}
{% endunless %}
