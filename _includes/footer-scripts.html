<!-- UTM channel attribution -->
<script>
    // creating own implementation of closest since Internet Explorer does not support this
    function closestATag(element) {
        let node = element;
        while (node) {
            if (node.tagName === 'A') {
                return node;
            }
            node = node.parentNode;
        }

        return null;
    }

    document.body.addEventListener('click', function(e) {
      const element = closestATag(e.target);

      if (element) {
        const params = new Proxy(new URLSearchParams(window.location.search), {
          get: (searchParams, prop) => searchParams.get(prop),
        });
        const {utm_source, utm_medium, utm_campaign, utm_term, utm_content, gclid } = params;

        if (!utm_source && !utm_medium && !utm_campaign && !utm_term && !utm_content && !gclid) {
          return;
        }

        e.preventDefault();

        const toUrl = new URL(element.href);

        if (utm_source) {
          toUrl.searchParams.set('utm_source', utm_source);
        }
        if (utm_medium) {
          toUrl.searchParams.set('utm_medium', utm_medium);
        }
        if (utm_campaign) {
          toUrl.searchParams.set('utm_campaign', utm_campaign);
        }
        if (utm_term) {
          toUrl.searchParams.set('utm_term', utm_term);
        }
        if (utm_content) {
          toUrl.searchParams.set('utm_content', utm_content);
        }
        if (gclid) {
          toUrl.searchParams.set('gclid', gclid);
        }

        const toUrlWithUtmParams = toUrl.toString();

        const openInNewWindow = element.getAttribute('target');
        if (openInNewWindow === '_blank') {
          // opens in new window
          window.open(toUrlWithUtmParams, '_blank', 'noopener noreferrer');
        } else {
          window.open(toUrlWithUtmParams, '_self');
        }
      }
    });
</script>

<!-- show/hide logic for More Resources button -->
<script type="text/javascript">
    const $moreResourcesButtons = document.querySelectorAll('.more-resources');

    $moreResourcesButtons.forEach($button => {
      $button.addEventListener('click', () => {
        $button.nextElementSibling.classList.toggle('hide');
        $button.querySelector('.more-resources-chevron').classList.toggle('chevron-up');
      });
    });
</script>
