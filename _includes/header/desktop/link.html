<a class="menu-link" href="{{ include.href }}">
  {% include svg-icons/{{ include.icon-src }}.html %}

  <div>
    <span class="menu-link-heading">
      {{ include.title }}
    </span>

    {% if include.show-badge-for-new %}
      <span class="menu-link-badge-for-new">New</span>
    {% endif %}

    {% if include.description %}
      <p class="menu-link-description">{{ include.description }}</p>
    {% endif %}
  </div>
</a>
