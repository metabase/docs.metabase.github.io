<div class="events-carousel">
    <div class="images-container">
        {% for category in site.data.event-categories %}
            <div class="image-container">
                <div class="tagline">
                    <p>{{category.tagline}}</p>
                </div>
                <div class="card" data-category="{{category.slug}}"></div>
            </div>
        {% endfor %}
    </div>
    <div class="lateral-fader"></div>
</div>

<script src="/js/events/carousel.js"></script>
