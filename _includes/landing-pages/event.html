{% assign component = include.component %}
{% assign event = site.data.events | where: 'slug', component.slug | first %}

<div class="event landing-page__event">
  <div class="events">
    <div class="upcoming-events">
      <section class="hero">
        <h2>{{ component.headline }}</h2>
        <p>{{ component.subheading }}</p>
      </section>

      {% include pages/events/entry.html event=event %}
    </div>
  </div>
</div>
