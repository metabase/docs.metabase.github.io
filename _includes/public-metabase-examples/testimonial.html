{% assign component = include.component %}

<div class="data-source-testimonial">
  <h4>{{ component.headline }}</h4>
  <p>{{ component.text }}</p>

  <div>
    <img src="{{ component.author.image }}" alt="{{ component.author.name }}" loading="lazy" />
    <div>
      <h5>{{ component.author.name }}</h5>
      <p>{{ component.author.company }}</p>
    </div>
  </div>
</div>
