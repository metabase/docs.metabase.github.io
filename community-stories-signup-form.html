<style>
    html,
    body {
        margin: 0;

    }

        color: white;
        text-decoration: underline;
    }

        color: white;

<!-- Begin Mailchimp Signup Form -->
    <div class="bg-blue p-4 rounded-4" id="mc_embed_signup">
        <form action="//metabase.us10.list-manage.com/subscribe/post?u=869fec0e4689e8fd1db91e795&amp;id=ad0586930e&SIGNUP=https://www.metabase.com/community/" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate m-0" target="_blank" novalidate>
            <div id="mc_embed_signup_scroll">
                <div class="flex flex-column flex-row-sm align-baseline-sm justify-between">
                    <div class="mr-45">

                    </div>
                    <div class="flex flex-column flex-row-sm align-baseline-sm flex-full mt-3 mt-sm-0">
                        <div class="mc-field-group flex flex-full flex-column">
                            <input type="email" value="" name="EMAIL" class="required email input--lightPrimary bordered flex flex-full mb-2 mb-sm-0" id="mce-EMAIL" tabindex="-1" placeholder="Email Address">
                        </div>
                        <div class="clear ml-sm-2 flex flex-full flex-none-sm"><input type="submit" value="Subscribe" name="subscribe" id="mc-embedded-subscribe" class="Button Button--lightPrimary flex flex-full align-center" style="font-size: 16px;"></div>
                    </div>
                </div>
                <div id="mce-responses" class="clear">
                    <div class="response" id="mce-error-response" style="display:none"></div>
                    <div class="response" id="mce-success-response" style="display:none"></div>
                </div>    <!-- real people should not fill this in and expect good things - do not remove this or risk form bot signups-->

            </div>
        </form>
    </div>
