items:
  - question: "What is Data Studio in Metabase?"
    answer: <p>Data Studio is the space in Metabase where teams structure their data for self-service analytics. It’s where you build and manage data models, define metrics, and organize metadata so analytics stays understandable and reliable as more people, dashboards, and questions depend on it.</p>
  - question: "Can I define a semantic layer inside Metabase?"
    answer: <p>Yes, you can build and define your semantic layer inside Data Studio in Metabase. It lets you define shared business logic, like metrics and definitions once, and reuse them consistently across questions, dashboards, and embedded analytics.</p>
  - question: "Who is Data Studio for?"
    answer: "<p>Data Studio is designed for analytics engineers, analysts, or developers: anyone responsible for managing data, both for embedded or internal analytics.</p>"
  - question: "What problem does Data Studio solve?"
    answer: <p>As analytics grows, teams often run into duplicated logic, drifting metrics, and dashboards that break when things change. Data Studio helps prevent these issues by centralizing definitions, making dependencies visible, and giving teams safer ways to evolve their analytics without breaking downstream work.</p>
  - question: "Can Data Studio structure data for embedded analytics and customer-facing dashboards?"
    answer: <p>Yep. Data Studio works the same way whether your analytics are used internally or embedded in customer-facing products. Models, metrics, and definitions created in Data Studio can power embedded dashboards just as reliably as internal ones.</p>
  - question: "What plan is Data Studio available on?"
    answer: <p>Data Studio is an always-on part of Metabase. Core capabilities are available in every Metabase instance, with additional advanced features available for teams that need more complex workflows, including Python transforms, data lineage, dependency diagnostics, and more as they grow.</p>
  - question: "How do I get started with Data Studio?"
    answer: <p>If you’re already using Metabase, Data Studio is ready to use. You can start by publishing tables, defining metrics, or adding context to your existing data. New users can try it in Metabase open source, or explore advanced capabilities with a free trial.</p>
  - question: "How does Data Studio fit alongside existing data modeling and transformation tools? "
    answer: <p>Data Studio can support full transformation workflows for many teams on its own. For teams that already have established modeling or transformation workflows, Data Studio is designed to complement upstream work rather than replace it.</p>
