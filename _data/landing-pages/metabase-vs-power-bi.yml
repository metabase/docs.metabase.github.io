- component: two-checklists
  left-checklist:
    headline: What makes Metabase a good choice compared to Power BI?
    list-items:
      - '<b>Easy to use for everyone.</b> With intuitive tools like <a href="https://www.metabase.com/features/analytics-dashboards">interactive dashboards</a> with quick drill-through analyses, the <a href="https://www.metabase.com/features/query-builder">query builder to write questions without SQL</a>, and one-click-to-create charts.'
      - '<b>Open source and affordable.</b> <a href="https://www.metabase.com/pricing">Transparent pricing</a> for startups through to advanced functionality and support for Enterprise. Secure and scalable, with no limits on the size of your dataset.'
      - "<b>Super fast to set up, with simple integration to your preferred data tools and OS (e.g., not just Windows and the MS universe)</b>  Work with your favorite tools, from data sources, transformation, ETL, modeling, whether you’re on Windows, Mac, or Linux."
      - '<b>Interactive, customer-facing analytics in days, no sprints.</b> <a href="https://www.metabase.com/product/embedded-analytics">Customizable embedded analytics</a> that lets your customers explore their data with as much - or as little - flexibility as you want.'
      - "<b>Look and feel.</b> Customers tell us they prefer the look of charts and dashboards in Metabase over Power BI. Their teams find them easier to understand, and they dig the general vibe."
      - "<b>Help from our world class Success team.</b> Technical experts who help with everything from troubleshooting to advice on best practices. Customers <i>love</i> them."
      - '<b>Private and secure.</b> <a href="https://www.metabase.com/security">We never look at or copy your data</a>. And we prioritize privacy and security features to secure data access in your org, like SSO and fine-grained permissions.'
  right-checklist:
    headline: When might Power BI be a better fit than Metabase?*
    list-items:
      - "You’re an enterprise-level company working with large, complex data sets, with a dedicated team to run your BI program and ad hoc reports for the team."
      - "You only want some people querying your data."
      - "You’re not on a budget."
      - "You need all-in-one advanced data integration for data transformation and dataflows for ETL processes."
      - "You’ve got time to learn how to use Power BI"
      - "You’re a loyal subject to the Microsoft realm (Mac and Linux fans need not apply)."

