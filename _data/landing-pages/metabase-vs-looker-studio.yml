- component: two-checklists
  left-checklist:
    headline: What makes Metabase a good choice compared to Looker Studio?
    list-items:
      - "<b>Easy for everyone to use.</b> Click on column-headers to turn data into charts. Turn spreadsheets into interactive dashboards for tracking KPIs, spotting trends, and digging into what's going on."
      - "<b>Analyses on auto-pilot.</b> Get drill-throughs out of the box—click on a chart or table row to instantly break down data by category, time range, or other filters."
      - '<b>Get answers from your data.</b> Answer questions with clicks, not code—filter, summarize, and group data without SQL using the <a href="/features/query-builder">visual query builder</a>. No need to learn concepts like dimensions or parameters—Metabase keeps things intuitive, but gives you depth when you need it.'
      - '<b>Super fast to set up without any specialist skills.</b> Try <a href="https://store.metabase.com/checkout?dwh=1">Metabase Cloud with built-in database storage</a>.'
      - '<b>Build production-grade dashboards and embed them into your product.</b> <a href="https://www.metabase.com/product/embedded-analytics">Customizable, low-code embedded analytics</a> that lets your customers explore their data with as much - or as little - flexibility as you want.'
      - "<b>Help from our world-class Success team.</b> Technical experts who help with everything from troubleshooting to advice on best practices."
      - '<b>A secure, shared workspace.</b> Metabase is like a hub for your data where your team can self-serve insights, view and share reports, and create their own dashboards without the help of a data team. We prioritize <a href="/features/data-segregation">privacy and security features</a> to give secure data access within your org or users, like SSO and fine-grained permissions.'
      - '<b>Open source, affordable, and scalable.</b> <a href="https://www.metabase.com/pricing">Transparent pricing</a> for startups through to advanced functionality and support for Enterprise. Grow into SQL databases - Metabase will scale with you.'
  right-checklist:
    headline: "When might Looker Studio be a better fit than Metabase?*"
    list-items:
      - "You have basic reporting needs and only need simple visualizations without too much customizability."
      - "You don’t need a central place for teams to explore, collaborate on, and share data."
