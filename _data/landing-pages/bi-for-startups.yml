- component: feature-container
  headline: Give your team the power to get their own answers from data
  subheading: The data querying and visualization toolbox that caters to all your teammates, from the spreadsheet junkies to the Python disciples.
  list-items:
    - "<b>Go from tables to viz in a few clicks.</b> The same filters and summarizations you know and love as a starting point."
    - "<b>Ask questions with the modular query builder.</b> No SQL required."
    - "<b>Analysis on auto-pilot with the action menu.</b> Zoom in on specific records, break out on different categories, and more."
