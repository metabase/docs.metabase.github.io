- component: feature-container-reverse
  headline: The business intelligence tool built to scale with your startup
  subheading: As your startup grows, so will the amount of data, users, queries, and dashboards. Metabase will have your back from the early days through the Series B and beyond.
  list-items:
    - "<b>Single sign-on, JWT and advanced LDAP</b> for secure access, and permission grouping and user mapping made simple"
    - "<b>Row- and column- level permissions</b> let you get really granular with what people see. Not a cell unaccounted for."
    - "<b>Fine-grained usage analytics</b> for staying on top of compliance, seeing who’s doing what, and optimizing usage and performance."
  media:
