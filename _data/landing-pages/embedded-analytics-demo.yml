- component: faq
  items:
    - question: What is embedded analytics?
      answer: <p>Embedded analytics platforms let you integrate the best of Business intelligence (BI tools) and functionality into your software app, product, or website. They’re designed to query and visualize data into actionable insights, made accessible to your customers and business users. They do this by:</p><p> - Analyzing and summarizing data - embedded BI tools can identify patterns, trends, and relationships within your data.</p><p> - Creating visualizations - They can present this information in easy-to-understand formats like charts, graphs, and dashboards.</p><p> - Facilitating forecasting - These tools can help predict future trends based on historical data.</p><p>Overall, embedded BI empowers your customers to make data-driven decisions.</p>
    - question: What are the benefits of embedded analytics tools?
      answer: <p>Embedded analytics solutions allow you to put your customers’ data - and datasets that are relevant to them - in front of them, with as much or as little analytics functionality as you want. Without investing countless months and resources into building your own analytics solution. Many startups through to enterprise level companies use embedded analytics to get to proof of concept in just a couple of weeks, and work with people who build analytics solutions for a living so they can focus on the goals of their business.</p>
    - question: How to choose the right embedded analytics solution?
      answer: <p>When it comes to choosing an embedded analytics tool, it depends on how much or how little analytics capabilities you want to offer your customers, how fast you need to get going, and how much budget you have. The key features of an embedded analytics tool include:</p><p> - Embed charts and visualizations as iframes with a snippet.</p><p> - Embed dashboards with more advanced filtering and click-through analytics capabilities.</p><p> - Querying interface to let customers self-service analytics, run their own reports, filter and summarize data.</p><p> - White-label analytics to make it look and feel like your brand and fit with your app while delivering a premium user experience.</p>With Metabase, you get the best of embedded BI with affordable pricing, and ungated access to technical help from the customer success engineers.</p>
    - question: Give it to me straight - which is the best embedded analytics tool?
      answer: <p>There’s no right or wrong answers here. It will generally depend on your use case, how much you want your customers and end users to be able to learn from data and run reports on their own without depending on your data team; your preferred data stack, how fast you need to get up and running, your budget, and more.</p><p>Again, there’s no “right” answer, but just sayin’ - Metabase is user-friendly to let everyone on your team get real-time insights from data. It works well with all of your datasets and preferred data tools (from data sources, data preparation, and semantic layering tools). It gets up and running in 5 minutes flat. And pricing is suited to all budgets (and you can try it for free).</p><p>Teams who have used Tableau, Microsoft’s Power BI, Google’s Looker, Domo, Sisense, Sigma and other embedded BI platforms now choose Metabase as it lets their customers and business users self-service analytics. User-friendly drag-and-drop data analytics lets people run ad hoc reports on their own and get actionable insights without needing SQL or a data analytst.</p>
    - question: Does my whole team need to know SQL to use Metabase?
      answer: <p>Metabase lets people ask questions with or without needing to know SQL. The intuitive Query Builder lets non-technical or data savvy people put together analyses with clicks - no SQL necessary. A promise made by many analytics tools, but not always delivered. Analysts and data people who prefer to write SQL can fill their boots in the SQL editor.</p>
    - question: Who uses Metabase as an embedded analytics solution?
      answer: <p>Metabase is trusted by over 90,000 companies with their data analytics, from startups who need their first business intelligence tool for internal or embedded analytics, through to Enterprises with large datasets, sophisticated use cases, and significant end users.</p><p>Metabase open source is the go-to choice for founders and solo-developers to let their teams get answers from data on their own so they’re not running the same reports once a month. Metabase Pro and Enterprise is generally chosen by CTOs, CPOs, Heads of Data who have been there, done that with every other BI platform on the market and need a way to make self-service analytics actually happen.</p><p>You’ll have to take our word on this one, but Metabase is even used by several of our competitors (who have asked us not to show their logos, of course). Could we even make that up?</p>
    - question: Can I use Metabase for data analysis with Excel or Google Sheets?
      answer: <p>Yes, you can use Metabase for data analysis with Excel or Google Sheets. Here’s how:</p><p> - Upload CSV data to Metabase - Combine spreadsheet data with datasets in connected tables and data warehouses. It’s big data meets little data.</p><p> - Export Data - Use Metabase to query your data and then export the results directly to Excel or CSV format.</p><p> - Google Sheets Integration - Utilize third-party tools like the Metabase integration for Google Sheets to sync query results directly into your spreadsheets.</p><p> - API Access - Leverage Metabase’s API to automate data extraction into Excel or Google Sheets for dynamic updates.</p><p> - Scheduled Reports - Set up scheduled email reports from Metabase, sending query results to your inbox, which can be easily imported into Excel or Google Sheets.</p><p>Metabase’s capabilities in uploading data, exporting data, using third-party integrations, and providing API access make it flexible for combining powerful data analysis with familiar spreadsheet tools.</p>
