- component: hero-b
  headline: Air-gap your Metabase to keep your data in a totally isolated environment
  subheading: Give your team easy-to-use, self-service analytics without exposing your infrastructure to the internet.
  badge-text: Air-gapping
  links:
    - text: Talk to sales
      href: https://www.metabase.com/talk-to-a-person/
      extra-classes: btn-primary
  media:
    type: image
    src: /images/landing-pages/air-gapping-hero.png
    alt: Metabase logo with a shield to signify maximum security with air-gapping

- component: hero-c
  cards:
    - icon: coin
      headline: Set up in 5 minutes
      text: No specialist or niche technical skills required. Designed to be the same as setting up a regular Metabase.
    - icon: document
      headline: Open source
      text: 100% of the code can be audited by the entire world, 24/7. Plus you always have access to make changes as you need to.
    - icon: modules
      headline: Works with what's in your data stack
      text: Vendor approval can be long and painful. Metabase connects to the data tools you’re using and integrates with your ecosystem.

- component: customer-logos

- component: two-checklists
  left-checklist:
    headline: When do you need to air-gap your Metabase
    list-items:
      - "When you need complete isolation from the internet, often due to regulatory compliance or heightened security requirements.
If you're not sure if you need an air-gapped environment, then you probably don't need to air-gap your Metabase."
  right-checklist:
    headline: When internet-connected deployments, either self-hosted or Cloud, are the better choice
    list-items:
      - "If you don't need air-gapping, this is how everyone else runs Metabase. Self-hosted deployments give you more control, while Cloud deployments save on time and effort."

- component: feature-container-reverse
  headline: Checks all your compliance boxes
  subheading: Maximum privacy, built for those of us who really need super secure, isolated environments (like in healthcare or banking or any work where security is paramount).<br>Nothing ever leaves your data center. Never connects to the internet. No outbound connections.
  media:
    type: image
    src: /images/landing-pages/compliance.png
    alt: Illustration of the Metabase logo at the centre of a number of compliance badges

- component: testimonial
  testimony: “We operate a number of private data centres for our systems, and an air-gapped version of Metabase allows us to reduce the attack surface for cyber security reasons.<br>Let alone the potential impact of a cyber attack on system uptime, being a heavily regulated company, being air-gapped further reduces the risk of data breaches and sensitive and private data loss.<br>It also optimizes and maximizes operational availability as the system is network failure resilient.”
  image:
    src: /images/home/frederic-tremblay.jpeg
    alt: Photo of Frédéric Tremblay
  author: Frédéric Tremblay
  role-and-company: Head of Business Intelligence, LMAX Group

- component: feature-container
  headline: No specialist setup required
  subheading: Setting up an air-gapped Metabase is pretty much the same as a regular Metabase in terms of difficulty and effort (which is to say—low).<br>The only difference is that the jar itself is air-gapped and we use Asymmetric (public and private key) Encryption.<br>Works with all the data tools you’re already using.
  media:
    type: image
    src: /images/landing-pages/air-gapping.png
    alt: Illustration of the Metabase logo at the centre of a number of compliance badges

- component: testimonial
  testimony: "At Tamkeen Technologies, we have implemented Metabase in an air-gap architecture, fully isolating it from external networks. This ensures compliance with industry regulations, safeguards sensitive information, and prevents unauthorized access. By enhancing data security and auditing capabilities, we empower informed decision-making while reinforcing trust and confidentiality for all stakeholders."
  image:
    src: /images/testimonials/faris-alokeeli.jpg
    alt: Photo of Faris Alokeeli
  author: Faris Alokeeli
  role-and-company: Director, Database Management, Tamkeen Technologies
- component: feature-container-reverse
  headline: Plus all the best of Metabase’s security features
  subheading: Your air-gapped Metabase comes with premium security features only found on Metabase Pro and Enterprise.
  list-items:
    - "<b>Single-sign</b> on access and permission grouping"
    - "<b>Data segregation</b> including row- and column-level permissions"
    - "<b>Usage analaytics and audit logs</b> to see who did what, when"
    - "<b>Connection impersonation</b> to centralize permissions on the database"
    - "<b>White labeling</b> to make it look and feel like your own"
  media:
