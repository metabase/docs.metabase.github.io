- component: faq
  items:
    - question: How does cloud BI work?
      answer: <p>Business intelligence tools (BI tools) are software applications designed to transform your raw data from databases, data warehouses, and spreadsheets into actionable insights. Cloud BI is hosted and deployed in Metabase Cloud, as opposed to hosted and maintained on-premise by you.</p><p>Business intelligence tools let people work with data:</p><p> - Analyzing and summarizing data - BI tools can identify patterns, trends, and relationships within your data.</p><p> - Creating visualizations - They can present this information in easy-to-understand formats like charts, graphs, and dashboards.</p><p> - Providing alerts and notifications - BI tools can set up alerts to notify you of important changes or emerging trends in your data.</p><p> - Facilitating forecasting - These tools can help you predict future trends based on historical data.</p><p>Overall, BI tools empower you to make data-driven decisions by giving you a clear and comprehensive picture of your business performance.</p>
    - question: What are the benefits of cloud-based BI?
      answer: <p>Metabase cloud infrastructure lets you benefit from:</p><p> - Operational efficiency with fewer manual tasks like backups, upgrades, and maintenance.</p><p> - It’s cost-effective. Self-hosting sometimes appears as a a cheaper option but can come with a laundry list of hidden costs. Metabase cloud is one of the most affordable cloud-based business intelligence solutions on the market.</p><p> - Private cloud, containerized deployment with no noisy neighbors.</p><p> - Hosted near you. Keep your BI close to your data.</p><p>Focus on your business needs instead of hosting your business intelligence.</p>
    - question: Give it to me straight - which is the best cloud-based business intelligence tool?
      answer: <p>There’s no right or wrong answer here. It will generally depend on your use case, how much you want people to be able to learn from data and run reports on their own without depending on your data team; your preferred data stack, how fast you need to get up and running, your budget, and more.</p><p>Again, there’s no “right” answer, but just sayin’ - Metabase is user-friendly to let everyone on your team get real-time insights from data. It works well with all of your datasets and preferred data tools (from data sources, data preparation, and semantic layering tools). It gets up and running in 5 minutes flat. And pricing is suited to all budgets (and you can try it for free).</p><p>Teams who have used Tableau, Microsoft’s Power BI, Google’s Looker, Domo, Sisense and other business intelligence platforms in the past now choose Metabase as it lets their business users self-service analytics. User-friendly drag-and-drop data analytics lets people run ad hoc reports on their own and get actionable insights without needing SQL.</p>
    - question: Is on-premise BI better than cloud BI?
      answer: <p>The choice to go with on-premise deployment or cloud-based business intelligence will depend on your business, use cases, needs and regulatory requirements.</p><p>Self-hosting, or on-premise deployment may be necessary if you need any of the following:</p><p> - An air-gapped environment</p><p> - You're using a community or custom driver to connect to your data source</p><p> - A custom build of Metabase</p><p> - Or if you have specific regulations about how you run your software (like HIPAA)</p><p>The good news is that with Metabase you have a choice whether you run it on-premise or opt for Metabase Cloud. It’s simple to migrate at any time, and back again if you need to. All of your existing questions and dashboards will be migrated over, so there's no need to start over from scratch.</p>
    - question: How does cloud BI enhance data security and compliance?
      answer: <p>Metabase has a serious commitment to data security and privacy. We don’t want your data. It stays on your servers as much as possible, and whatever we touch is encrypted in transit, and any identifiable data is hashed.</p><p>Metabase is SOC 2 Type II, GDPR, and CCPA compliant. Besides compliance audits, we have independent application and infrastructure-level penetration tests a few times a year, with test results prioritized and fixed fast.</p><p>Systems are segmented into separate networks with firewalls between networks. All servers in our production fleet are hardened according to CIS benchmarks.</p><p>In case that doesn’t cut it and you need single-tenant cloud deployment, or an air-gapped environment, you can switch your Metabase deployment at any time.</p>
    - question: How easy is on-premise BI to deploy and set up?
      answer: <p>BAs an open source business intelligence platform, Metabase’s on-premise solution is pretty straightforward to deploy and set up. You can download Metabase as a JAR file and run on your machine, or run via Docker.</p><p>Anyone can run an on-premise version of Metabase, but when it comes to running production grade deployment, maintenance can skew more technical. Cloud BI like Metabase lets anyone - even those without technical expertise - get Metabase up and running fast, with maintenance taken care of.</p>
    - question: Does my whole team need to know SQL to use cloud BI software like Metabase?
      answer: <p>Metabase lets people ask questions with or without needing to know SQL. The intuitive Query Builder lets non-technical or data savvy people put together analyses with clicks - no SQL necessary. A promise made by many analytics tools, but not always delivered. Analysts and data people who prefer to write SQL can fill their boots in the SQL editor.</p>
    - question: Who uses Metabase as a cloud BI solution?
      answer: <p>Metabase is trusted by over 60,000 companies with their data analytics, from startups who need their first business intelligence tool through to Enterprises.</p><p>Metabase open source is the go-to choice for founders and solo-developers to let their teams get answers from data on their own so they’re not running the same reports once a month. Metabase Pro and Enterprise is generally chosen by CTOs, CPOs, Heads of Data who have been there, done that with every other BI platform on the market and need a way to make self-service analytics actually happen.</p><p>You’ll have to take our word on this one, but Metabase is even used by several of our competitors (who have asked us not to show their logos, of course). Could we even make that up?</p>
