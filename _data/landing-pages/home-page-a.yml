- component: hero-a
  headline: Not another self-service analytics tool
  subheading: If “self-serve” means dashboards no one reads, broken queries, and just as many pings for ad hoc reports — yeah, this isn't that. Metabase is Business Intelligence and Embedded Analytics that connects to your database to let business users get answers.
  links:
    - text: Try Metabase Cloud free
      href: https://store.metabase.com/checkout
      extra-classes: btn-primary
    - text: Deploy Metabase Open Source
      href: /start/oss/
      extra-classes: btn-outline-blue
  media:
    type: video
    id: hero-a
    source_mp4: /images/landing-pages/hero-query-builder.mp4
    poster: /images/landing-pages/hero-query-builder.gif

- component: hero-c
  cards:
    - icon: coin
      headline: Built for SaaS teams--before your first data hire
      text: Spin up reporting your non-technical teammates and customers can actually use today, not in the next sprint. No training, no one left Slacking you for numbers.
    - icon: document
      headline: Easy to use reporting for internal dashboards and analytics
      text: Let business users query, visualize and learn from data on their own. From finance, to CS, to sales. <a href="/product/business-intelligence">Check out Business Intelligence</a>
    - icon: modules
      headline: Customer-facing dashboards
      text: Drop white-labeled, customizable reporting into your app without building from scratch. <a href="/product/embedded-analytics">Check out Embedded Analytics</a>

- component: customer-logos

- component: feature-container
  headline: Set up before your next stand up
  subheading: No training, no hidden costs, no lengthy sales cycles (unless you want to chat to someone in our sales team, they're pretty chill)
  list-items:
    - '<b>Spin up an instance in minutes.</b> <a href="/start/oss/">Launch with a single command</a>. Skip the months of back and forth.'
    - '<b>Connect to your database.</b> Visualize and query <a href="/data-sources">live data in your database</a>, not extracts. Your data stays on your servers'
    - '<b>Deploy however you want.</b> On <a href="/cloud">Metabase Cloud</a>, self-hosted, air-gapped, or single-tenant. Migrate to a different deployment type without losing any content.'
    - '<b>Always open source, transparent.</b> Built to scale with you. <a href="/pricing">Startup-friendly pricing</a>, with Pro and Enterprise tiers for advanced features, support, and compliance.'
  media:
    type: video
    id: drill-through
    source_mp4: /images/landing-pages/hero-query-builder.mp4
    poster: /images/landing-pages/hero-query-builder.gif

- component: feature-container-reverse
  headline: Give people the power to get their own answers from data
  subheading: The data querying and visualization toolbox that lets all your teammates to work with data, whether their natural habitat is Excel or SQL.
  list-items:
    - '<b>Create and share interactive dashboards.</b> Find the "why" behind the chart. <a href="/features/analytics-dashboards">Filter and drillthrough</a> to turn one-size-fits-all reports into customized insights.'
    - "<b>Go from tables to visualizations in a few clicks.</b> Familiar spreadsheet functions with way more telling outcomes."
    - '<b>Query data without SQL.</b> Compose  analyses and aggregations in the <a href="/features/query-builder">visual query builder</a> with clicks. No SQL required (but wtih a <a href="/features/sql-editor">SQL editor</a> there if you need it).'
  media:
    type: video
    id: drill-through
    source_mp4: /images/landing-pages/drill-through.mp4
    poster: /images/landing-pages/drill-through.gif

