  left-checklist:
    headline: What makes Metabase a good choice compared to Domo?
    list-items:
      - '<b>Easy for everyone to use.</b> Intuitive tools like <a href="https://www.metabase.com/features/analytics-dashboards">interactive dashboards</a> with quick drill-through analyses, the <a href="https://www.metabase.com/features/query-builder">query builder to write questions without SQL</a>, and one-click-to-create charts.'
      - '<b>Open source and affordable.</b> <a href="https://www.metabase.com/pricing">Transparent pricing</a> for startups through to advanced functionality and support for Enterprise. Secure and scalable, with no limits on the size of your dataset.'
      - "<b>Super fast to set up.</b> Even without technical skills, an account rep, or a shaman to guide you."
      - "<b>Best of BI.</b> Works with your favorite data tools, from storage, to ETL, to semantic layering. We give you options, while we focus on delivering performant, secure, usable analytics features."
      - '<b>Interactive, customer-facing analytics in days, not sprints.</b> <a href="https://www.metabase.com/product/embedded-analytics">Customizable embedded analytics</a> that lets your customers explore their data with as much - or as little - flexibility as you want.'
      - "<b>Help from our world-class Success team.</b> Fast, direct help from technical experts, no intermediate support agents. Customers <i>love</i> them."
      - '<b>Private and secure.</b> <a href="https://www.metabase.com/security">We never look at or copy your data</a>. And we prioritize privacy and security features to secure data access in your org, like SSO and fine-grained permissions.'
  right-checklist:
    headline: When might Domo be a better fit than Metabase?*
    list-items:
      - "You’re an enterprise-level company working with large, complex data sets from many different sources, with a team to run your BI program and ad hoc reports for the team."
      - "You’re not on a tight budget, and consumption-based, annual billing works for you."
      - "You need all-in-one advanced data integration for data warehousing, transformation and dataflows for ETL processes."
      - "You need to plug in directly from a diverse range of data sources, from Instagram to Google Fit to Workday."
      - "You only want some people querying your data."
      - "You’ve got time to go through their sales cycle."
      - "You don’t have specific deployment requirements (Domo is cloud-hosted)."

