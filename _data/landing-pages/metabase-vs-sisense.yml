- component: feature-container-reverse
  headline: What's the difference between Metabase and Sisense?
  subheading: <p>TL;DR - Metabase gets <a href="https://www.metabase.com/product/embedded-analytics">embedded interactive analytics</a> up and running faster than you can figure out how much Sisense costs (even roughly). With no solid pricing indication on their website, we’re going off <a href="https://www.reddit.com/r/BusinessIntelligence/comments/b2zmjg/sisense_pricing/">what Reddit says</a>, which is that it’ll cost you a chunk of change an order of magnitude (approx.) larger than the cost of running Metabase. Sisense has a steeper learning curve than Metabase. Metabase lets everyone - even non-technical or data-savvy people - query data with or without SQL.</p>
  media:
    type: video
    source_mp4: /images/landing-pages/drill-through.mp4
    poster: /images/landing-pages/drill-through.gif

