- component: faq
  items:
    - question: When is Metabase a better choice than Sisense?
      answer: <p>Metabase is best suited for businesses that need a straightforward embedded analytics solution that lets businesses integrate customer-facing analytics in apps without the heavy lifting of a proprietary build, or expense of other embedded analytics tools. It lets everyone in and outside of your company self-serve analytics without having to rely too heavily on your data team. It's BI that people will actually enjoy using, at the right price for your scale.</p>
    - question: When is Sisense a better choice than Metabase?
      answer: <p>Credit where it’s due - Sisense may be a good fit for larger enterprises or orgs with more extensive data analysis and customization needs, deep pockets, and a lower need for everyone in the org to be able to jump in and run their own reports. It’s got a lot of bells and whistles - and depending on the maturity of your org, your use case and needs, it may be more than you need.</p>
    - question: Who uses Metabase over Sisense?
      answer: <p>Metabase is trusted by over 50,000 companies with their analytics, from startups who need their first business intelligence tool through to Enterprises. Metabase open source is the go-to choice for founders and solo-developers to embed analytics in their platforms to let people get answers from data on their own. Metabase Pro and Enterprise is generally chosen by CTOs, CPOs, Heads of Data who have been there, done that with every other BI tool on the market and need a way to make self-service analytics actually happen.</p>
    - question: What use cases do Metabase and Sisense cover?
      answer: <p>Metabase offers customer-facing embedded analytics as well as internal-facing analytics for companies. Sisense is geared primarily towards embedding.</p><p>Metabase is ideal for quick, intuitive data exploration that lets people in your company click around in interactive dashboard and visualizations to learn from data, or create queries with or without SQL.</p><p>Sisense may be better suited for complex data analysis and putting detailed visualizations in front of customers.</p>
    - question: What’s the difference in pricing between Metabase and Sisense?
      answer: <p>Metabase is open source with affordable plans available for additional security and governance features, cloud deployment, and fast, unlimited technical help from engineers.</p><p>Sisense's pricing is generally higher - from what we can tell; it's pretty opaque.</p>
    - question: Do you need to know SQL to use Metabase and Sisense?
      answer: <p>Metabase and Sisense both let data analysts work in SQL; and less technically savvy people ask questions without SQL. Metabase's intuitive Query Builder lets non-technical or data savvy people put together analyses with clicks - no SQL necessary. Analysts and data people who prefer to write SQL can fill their boots in the SQL editor.</p>
    - question: How do Metabase and Sisense compare in terms of visualization capabilities?
      answer: <p>Metabase and Sisense give people a way to visualize their data and make sense of the numbers. But Metabase is so much more than just a visualization tool. For people who feel like they’re seeing double when staring at columns, it’s an intuitive way to filter and summarize to uncover trends and get insights to make data-driven decisions.</p>
    - question: Ok, give it to me straight though - what’s the best embedded analytics platform?
      answer: <p>There’s no right or wrong answer here. It will generally depend on your use case, how much you want people to be able to learn from data and run reports on their own without depending on your data team; your preferred data stack, how fast you need to get up and running, your budget, and more.</p><p>If you’re curious about how other BI tools compare, check out our <a href="/blog/metabase-alternatives">Metabase Alternatives</a> post, where we explore how Metabase stacks up against other options.</p><p>Again, there’s no “right” answer, but just sayin’ - Metabase will let everyone on your team work with data, integrates with your preferred data tools, gets up and running in 5 minutes flat, and suits all budgets (and you can try it for free).</p>
