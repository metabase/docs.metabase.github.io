- component: hero-c
  cards:
    - icon: coin
      headline: Live in minutes
      text: Deploy Metabase with a single command. <a href="/data-sources">Connect to your database</a>. Start building dashboards today.
    - icon: document
      headline: Real insights, not demo decks
      text: Let CS, product, and ops teams ask and answer real questions — no SQL or training required. <a href="/product/business-intelligence">Check out Business Intelligence</a>.
    - icon: modules
      headline: Embedded reporting, out of the box
      text: Build white-labeled dashboards into your app. Secure, interactive, customer-ready, fast. <a href="/product/embedded-analytics">Check out Embedded Analytics</a>.

