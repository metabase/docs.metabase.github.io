- component: two-checklists
  left-checklist:
    headline: What makes Metabase a good choice compared to Looker?
    list-items:
      - '<b>Easy for everyone to use.</b> Intuitive tools like <a href="https://www.metabase.com/features/analytics-dashboards">interactive dashboards</a> with quick drill-through analyses, the <a href="https://www.metabase.com/features/query-builder">query builder to write questions without SQL</a>, and one-click-to-create charts.'
      - '<b>Set up without any specialist skills or modeling languages.</b> Query and visualize your data source as soon as you add it. You don’t <i>have</i> to model it first - but you <i>can</i> with <a href="https://www.metabase.com/features/models">intuitive model creation</a> that doesn’t take 6+ weeks to learn.'
      - '<b>Open source and affordable.</b> <a href="https://www.metabase.com/pricing">Transparent pricing</a> for startups through to advanced functionality and support for Enterprise.'
      - "<b>Super fast to set up and integrate with your favorite data tools, like dbt for modeling.</b> Go from install to creating your first dashboard in less than 5 minutes. No technical skills or data team required."
      - '<b>Interactive, customer-facing analytics in days, not sprints.</b> <a href="https://www.metabase.com/product/embedded-analytics">Customizable embedded analytics</a> that lets your customers explore their data with as much - or as little - flexibility as you want.'
      - "<b>Help from our world-class Success team.</b> Technical experts who help with everything from troubleshooting to advice on best practices. Looker’s once raved about Department of Customer Love is no longer (raved about, nor exists) since they were acquired."
      - '<b>Private and secure.</b> <a href="https://www.metabase.com/security">We never look at or copy your data</a>. And we prioritize privacy and security features to secure data access in your org, like SSO and fine-grained permissions.'
  right-checklist:
    headline: When might Looker be a better fit than Metabase?*
    list-items:
      - "You’re LookML certified (or have access to someone who is)."
      - "You need a lot of governance built into your business intelligence platform with advanced modeling for complex data relationships and calculations."
      - "You need a modeling layer strictly in code"
      - "You only want <i>some</i> of your people querying your data."
      - "You’ve always wanted to learn LookML and you’ve got a fair bit of time to pick it up (think 6 weeks)."
      - "You’re a technical team - or you’ve got access to technical people with a decent amount of time - who can help with configuration and set up."
      - "You hang out exclusively in the Google Suite."

