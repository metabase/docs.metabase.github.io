- component: faq
  items:
    - question: What’s the best business intelligence tool to connect to Redshift?
      answer: <p>Redshift pairs with a number of BI tools - including Amazon’s own Quicksight. While this gives you a good way to keep everything in the Amazon ecosystem, Metabase is the most effective way to let everyone in the team start working with data. Because of sophisticated but easy-to-use data tools like the query builder, which lets people ask questions without SQL, Metabase has a low learning curve. Simple drill-through, zoom-in, and breakout functionality lets people learn more from data with just a few clicks.</p><p>You can set up and connect Metabase to Redshift in about 5 minutes and begin querying immediately, with drill-through functionality automatically generated and ready for people to start uncovering insights. Metabase is also open source and affordable, with plans and pricing that scales with you.</p>
    - question: How does Metabase connect to Redshift?
      answer: <p>You can connect to Redshift when you’re setting up a new Metabase instance, or add a database connection any time in your admin settings:</p><p>To add a database connection, click on the gear icon in the top right, and navigate to Admin settings > Databases > Add a database.</p><p><a href="/docs/latest/databases/connections/redshift">For the full details on connecting Metabase to Redshift, check out our documentation</a>.</p>
    - question: Can I use permissions from my Redshift database in Metabase?
      answer: <p>Yes! Permissions set up in your Redshift database can be impersonated in Metabase. (This is currently only possible for Redshift, PostgreSQL, Snowflake, and ClickHouse databases)</p><p>With granular row-level permissions and user group mapping, you can effectively set up permissions to match those applied in Redshift.</p><p><a href="/docs/latest/permissions/start">Learn more about Metabase permissions in our documentation.</a></p>
    - question: How can you visualize tables in Redshift?
      answer: <p>Metabase fits with Redshift as a querying and visualization layer on top of your data. With Metabase you can query data in Redshift - with or without SQL - to create a broad range of data visualizations and types and tell a story with interactive dashboards. Viewers can filter and drill-through to get what’s most relevant, and dig deeper on what’s important to them. Visualizations and dashboards can even be shared or embedded in your app.</p>
    - question: How can you query data in Redshift?
      answer: <p>Redshift helps you analyze unstructured, semi-structured, and structured data stored in Amazon S3 - but you’ll likely need pretty advanced data and technical skills to be able to do it.</p><p>Metabase makes it possible for everyone in the team to run their own reports, without data skills or relying on someone else to write SQL for them. People used to working in Excel can leverage skills usually reserved for spreadsheets to get the answers they need from data in Redshift.</p>
    - question: How to create dashboards using Redshift?
      answer: <p>Metabase lets you bring together charts, visualizations, and questions into interactive dashboards that can be shared with your team and customers.</p><p>The automatically generated drill-through menu lets people click on charts to zero in on a particular category or parameter for further analysis; view individual records, or zoom in on a targeted date range. You can also add filters to let people slice the data on what’s most important to them, and add custom-click behaviors to guide data discovery (e.g. send people to a related dashboard).</p>

