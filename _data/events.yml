  intro: "<p>We analyzed how 330+ data teams are building their stacks in 2025: what tools they're choosing, how those tools interact, and where things break.</p>
    <p>Some of what we found:</p>
<ol>
<li>Postgres dominates #1 for both transactions and analytics storage.</li>
<li>50% of teams skip warehouses/lakes entirely.</li>
<li>AI adoption is up, but average trust is just 5.5/10.</li>
</ol>
<p>In this session, we'll walk through the top patterns from the <a href=\"/data-stack-report-2025\">Metabase Community Data Stack Report 2025</a>, show how we approached the analysis, and share our take on why certain tools (and workarounds) are winning.</p>
<p>If you're building, maintaining, or rethinking a stack, this is a technical look at what real teams are doing-not just what vendors say they are.</p>
"

