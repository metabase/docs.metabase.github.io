  time_utc: "16:00"
  registration_snippet: "<div id=\"__contrast_registration_c984a78f-fa31-45c1-b50e-5a344874baba\" style=\"width: 100%; height: 100%;\"></div> <script type=\"text/javascript\"> (() => { const frameContainer = document.getElementById( '__contrast_registration_c984a78f-fa31-45c1-b50e-5a344874baba' ); const iframeUrl = new URL( 'https://watch.getcontrast.io/widgets/register/metabase-interactive-embedding-workshop/recurring?primaryColor=%23509ee3&locale=en' ); const iframe = document.createElement('iframe'); iframe.src = iframeUrl.href; iframe.setAttribute('style', 'width: 100%; height: 100%; border: 0;'); iframe.setAttribute('title', 'Contrast registration form'); if (window.location.search) { const urlParams = new URLSearchParams(window.location.search); const utms = { utm_medium: urlParams.get('utm_medium'), utm_source: urlParams.get('utm_source'), utm_campaign: urlParams.get('utm_campaign'), utm_content: urlParams.get('utm_content'), utm_term: urlParams.get('utm_term'), }; Object.keys(utms).forEach((key) => { if (utms[key]) { iframeUrl.searchParams.set(key, utms[key]); } }); iframe.src = iframeUrl.href; } frameContainer.appendChild(iframe); })(); </script>"
  length: 45 minutes
  recording_id: 9z7kitVH3CM
  guests:
    - name: Thomas Pederson
      image: thomas-pedersen.png
      title: Co-founder & CEO, Bunny
    - name: Andrew Fleming
      image: andrew-fleming.png
      title: Product Advocate, Metabase
  intro: "<p>At Bunny, analytics isn’t just a nice-to-have - it’s a core part of how customers understand billing, revenue, and usage.</p>
<p>That meant offering fully embedded, customer-facing analytics with strict tenant isolation, strong data privacy, and enough flexibility to explore data without engineering help. Building all of that in-house would have taken significant time and pulled the team away from their core product.</p>
<p>In this live session, Thomas Pedersen, CEO & co-founder at Bunny, will share how they embedded Metabase into their SaaS product, why they chose to deploy it on their own AWS/Postgres infrastructure, and how they handle multi-tenancy, permissions, and white-labeling.</p>
<p>You'll learn:</p>
<ol>
<li>Why multi-tenancy is critical for customer-facing analytics</li>
<li>How Bunny set up embedded, white-labeled BI with tenant-aware access</li>
<li>How data permissions and self-serve analytics work in practice</li>
<li>When it makes more sense to embed BI instead of building it yourself</li>
</ol>
"

