  - name: "Metabase Basics"
    slug: "metabase-basics"
    pages:
      - name: "Metabase overview"
        slug: "overview"
        summary: "What Metabase is and how it can help you."
        url: "/learn/metabase-basics/overview"
        pages:
          - name: "A tour of Metabase"
            slug: "tour-of-metabase"
            summary: "Metabase is a deep product with a lot of tools to simplify business intelligence, from embeddable charts and interactive dashboards, to GUI and SQL editors, to auditing and data sandboxing, and more."
            url: "/learn/metabase-basics/overview/tour-of-metabase"
          - name: "Metabase concepts"
            slug: "concepts"
            summary: "A quick overview of the core concepts in Metabase."
            url: "/learn/metabase-basics/overview/concepts"
          - name: "Advanced Metabase features for data analysts"
            slug: "next-steps"
            summary: "Set up alerts, annotate charts with events, model data, templatize SQL queries, customize click behavior, and more."
            url: "/learn/metabase-basics/overview/next-steps"
          - name: "Beyond BI: other problems you can solve with Metabase"
            slug: "beyond-bi"
            summary: "Use Metabase as a database browser, or a publishing platform, or a lookup tool, or a quick business intelligence tool, or as just a way to field frequently asked questions."
