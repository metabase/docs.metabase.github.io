- component: hero
  title: Get answers in a few clicks with the query builder
  description: The query builder makes it easy for anyone — even your less data-savvy teammates — to put together questions with just clicks, prompts, and menu choices. No data expertise or SQL needed.
  badge:
    text: Query builder
    icon: /images/icons/badges/query-builder-icon.svg
  ctas:
    - text: Get started
      href: https://store.metabase.com/checkout
    - text: Contact us
      href: /talk-to-a-person/
      extra-classes: btn-outline-blue
  video:
    id: query-builder
    poster: /images/features/query-builder.gif
    src: /images/features/query-builder1.mp4

- component: cards
  title: Analytics for everyone
  description: Point-and-click tool to self-serve data for those who don’t know SQL (and a mental-shortcut for those who do).
  items:
    - title: Filters and summarizations
      description: Click and select custom parameters to <a class="d-inline blue-link-hover text-bold" href="/docs/latest/questions/introduction">narrow down</a> and group data from a dropdown menu.
      icon: /images/icons/filter.svg
    - title: Joins
      description: Use joins to ask questions about data split across multiple models or tables.
      icon: /images/icons/join.svg
    - title: Custom expressions
      description: Go beyond basic questions with <a class="d-inline blue-link-hover text-bold" href="/docs/latest/questions/query-builder/expressions">custom expressions</a> (they’re like formulas in spreadsheets, e.g., a CountIf formula).
      icon: /images/icons/formula.svg
    - title: Multi-level aggregation
      description: Get a bit fancier with multi-level aggregation to stack more filters and summarizations step-by-step.
      icon: /images/icons/multi-level.svg
    - title: Preview results
      description: Check your question as you’re adding filters and summarizations without running the whole query, and make adjustments as you go.
      icon: /images/icons/play.svg
    - title: Question history
      description: Let anyone edit questions while keeping track of the question’s history. Metabase keeps the <a class="d-inline blue-link-hover text-bold" href="/docs/latest/questions/native-editor/writing-sql#question-version-history">fifteen most recent versions of each question</a>.
      icon: /images/icons/question-blue-circle-outline.svg

- component: list
  title: How to ask a question with the query builder
  items:
    - description: At the top-right corner in your Metabase, click New > Question to open the query builder. You can also get to the query builder by clicking Filter and/or Summarize at the top of a table or model, or clicking column headings and individual cells.
    - description: Select a table or a model or table you want to query, e.g. the Orders table from the sample dataset that ships with Metabase.
    - description: Click into <b>Filters</b> and select <b>Created at</b>. Select <b>Last 12 months</b>.
    - description: Click + to add another filter. This time select <b># Total</b>, then from the dropdown menu, select <b>Greater than</b>, and enter 20.00 in the text box.
    - description: Next, click into <b>Summarize</b> and select <b>Sum of…</b> and select <b>Taxes</b> from the menu.
    - description: The <b>by</b> box next to it is where you’re going to group your results. First select <b>Product > Category</b>.
    - description: To further group these results by month, click <b>+</b> and select <b>Created by</b>, and choose <b>month</b> from the menu.
    - description: Hit the <b>Visualize</b> button. You’ll see a chart that shows how taxes are split across product categories on orders month over month.

