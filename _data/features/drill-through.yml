- component: hero
  title: Pull threads in your data without even asking a question
  description: Drill-throughs give people an easy and intuitive starting-point to play with data, dig into specifics, and turn it into action.<br /><br />It's all in the click of a button.
  badge:
    text: Drill-through
    icon: /images/icons/badges/magnifier.svg
  ctas:
    - text: Get started
      href: https://store.metabase.com/checkout
    - text: Contact us
      href: /talk-to-a-person/
      extra-classes: btn-outline-blue
  video:
    id: breakout-filter
    poster: /images/features/breakout-filter.gif
    src: /images/features/breakout-filter.mp4

- component: cards
  title: Analysis on (almost) autopilot
  description: Click on charts, models, and questions to interact with the drill-through menu to filter, see individual records, auto-generate reports, and more.
  items:
    - title: Zoom in
      description: Find out why a number or trend went up or down around a certain date. Click-and-drag over a selected area on a chart to zoom in for a closer look, or use auto-zoom.
      icon: /images/icons/magnifying-glass.svg
    - title: View these records
      description: Get into the specifics by clicking to see a table with the individual records and values that make up the chart. Generate relevant lists to act on (like customers you need to call, asap.)
      icon: /images/icons/servers.svg
    - title: Breakout
      description: Breakout the data on specific dimensions, like time, location, category, and more. Different charts will have different breakout options based on the content.
      icon: /images/icons/bifurcate.svg
    - title: Filters
      description: Slice the data a different way by clicking to apply filters to see what’s higher, lower, or a similar value to what you’re looking at.
      icon: /images/icons/filter.svg
    - title: Custom-click behavior
      description: Determine where the next click leads, like relevant dashboards, saved questions, or a URL.
      icon: /images/icons/click.svg
    - title: Cross-filter
      description: Set cards to update filter widgets across a dashboard, e.g. click on a US state in a map card to show info on orders from that state across all cards on the dashboard.
      icon: /images/icons/filter-plus.svg
    - title: X-ray
      description: Create an automatically generated dashboard of questions about your data. Edit it as you please to keep what’s interesting, hedge what’s not, add more questions, and text boxes. It won’t hurt our feelings. Honest.
      icon: /images/icons/action-blue.svg

- component: list
  title: How to use drill-throughs on dashboards<br />and charts
  items:
    - description: Find a dashboard, chart, or model you want to learn more about.
    - description: Click anywhere over a chart made with the query builder, e.g. a state on a map, or a bar in a chart and pick an option in the drill-through menu (your options may vary based on the content of your question or model.)
    - description: That’s kinda it, go wild.

