- component: hero
  title: Total visibility into what's going on in your Metabase
  description: Metabase usage analytics is a collection of dashboards, questions, and models to understand and act on how your data is used in your Metabase, as well as performance, and configuration changes.<br /><br />Available on <b><a href="/product/pro">Pro</a></b> and <b><a href="/product/enterprise">Enterprise</a></b> plans.
  badge:
    text: Usage Analytics
    icon: /images/icons/badges/usage-analytics.svg
  ctas:
    - text: Get started
      href: https://store.metabase.com/checkout
    - text: Contact us
      href: /talk-to-a-person/
      extra-classes: btn-outline-blue
  video:
    id: collections
    poster: /images/features/usage-analytics.png
    src: /images/features/usage-analytics.mp4

- component: cards
  title: Know who did what, when
  description: Evergreen audit logs, usage stats and reports to monitor, investigate, and get notifications on what’s going on if and when you need them.
  items:
    - title: Usage reports, configuration changes, and performance data
      description: Comprehensive data on how your Metabase is being used, by who, and when for compliance and meta-analytics. Read-only by default to protect audit logs for posterity.
      icon: /images/icons/Type=Trend.svg
    - title: Interactive pre-defined dashboards
      description: See overall trends on usage stats in the collection of dashboards, like most viewed questions in Metabase. Home in on areas of interest with filters and the action menu to breakout, X-ray, or view individual records.
      icon: /images/icons/Type=Dashboard.svg
    - title: Models to create custom reports
      description: Your usage and audit data in a neat package, made easier to analyze, answer questions, and turn into your own investigations to save and share as custom reports.
      icon: /images/icons/model.svg
    - title: Set up subscriptions and alerts on user behavior
      description: Get notified on a regular basis, or set alarms when things change unexpectedly and you need to investigate, like someone downloading a 10,000 row table.
      icon: /images/icons/Type=Alert.svg
    - title: Customize prebuilt dashboards
      description: Your audit logs are not-editable by default to be ironclad and enduring. But if you feel inspired to dig or take it in a different direction, click <b>Make a copy</b> to turn the content into a template that you can change all you want.
      icon: /images/icons/Type=Dashboard.svg
    - title: Manage access to usage analytics
      description: Give view or edit permissions as required, without making everyone an admin.
      icon: /images/icons/eye.svg

- component: list
  title: How to use Usage analytics
  description:
  items:
    - description: Go to the <b>Metabase analytics</b> collection in the left sidebar (note, admins will see this collection by default, otherwise you’ll need permissions enabled).
    - description: Open <b>Metabase metrics</b>. Select a date range, and filter on your available user groups. For example, you could filter down to an an “executives” user group to get an idea of who’s most active and what they’re interested in.
    - description: Set up a dashboard subscription to get notified about what’s top-of-mind in your org each week.

