- component: hero
  title: Analytics dashboards you’ll actually<br />want to use
  description: Bring together charts and questions on live dashboards with interactive tools to let everyone get the info they need.
  badge:
    text: Analytics dashboards
    icon: /images/icons/badges/dashboard.svg
  ctas:
    - text: Get started
      href: https://store.metabase.com/checkout
    - text: Contact us
      href: /talk-to-a-person/
      extra-classes: btn-outline-blue
  image:
    src: /images/features/dashboard-overview.gif

- component: cards
  title: Filter, X-ray, share and more
  description: Make it easy and intuitive to learn more from data with a few clicks.
  items:
    - title: Filters
      description: Add <b><a href="/docs/latest/dashboards/filters">filter widgets</a></b> to quickly tweak results on things like date ranges, categories, locations, and more.
      icon: /images/icons/filter.svg
    - title: Drill-through
      description: <b><a href="/learn/metabase-basics/querying-and-dashboards/questions/drill-through#select-to-zoom">Zoom in</a></b> on selected areas of a chart; <b><a href="/learn/metabase-basics/querying-and-dashboards/questions/drill-through#breakouts">breakout</a></b> on categories; and apply <b><a href="/docs/latest/exploration-and-organization/x-rays">X-rays</a></b> for auto-magic reports.
      icon: /images/icons/magnifying-glass.svg
    - title: Custom-click behaviours
      description: Show the drill-through menu, update filters, or send them to another dashboard, saved question, or URL.
      icon: /images/icons/click.svg
    - title: Sharing
      description: Link to or <b><a href="/product/embedded-analytics">embed dashboards</a></b>. Set up email and Slack subscriptions, or alerts for when something changes. Or export dashboards to PDF for quick and easy reporting.
      icon: /images/icons/share.svg
    - title: Speed
      description: <b><a href="/docs/latest/configuring-metabase/caching">Cache answers</a></b> to questions to keep load times low. You can even get specific about which questions, dashboards, and databases to cache on <b><a href="/product/pro">Metabase Pro</a></b> and <b><a href="/product/enterprise">Enterprise</a></b>.
      icon: /images/icons/speed.svg
    - title: Actions
      description: Write back to your database from your dashboards with Actions buttons for basic CRUD actions, like logging a new request, or editing a customer profile.
      icon: /images/icons/large-play-triangle-outline-blue.svg

- component: list
  title: How to build an analytics dashboard in Metabase
  description:
  items:
    - description: Create a new question or visualization in Metabase using the query builder, or click into an existing question.
    - description: From the menu at the top-right, select <b>Add to dashboard</b>.
    - description: Select an existing dashboard to add your question to, or click <b>Create a new dashboard</b>.
    - description: You’ll now see your question added to your dashboard. You can save it as is (even a one-question-dashboard counts as a dashboard), or add more questions, filters, headings, text or links.
    - description: These steps can also be done in reverse, by clicking <b>New > Dashboard</b> and adding saved questions or creating new ones.

