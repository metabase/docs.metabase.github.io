- component: cards
  title: Interactive, collaborative, and built for data pros and non-technical people
  description: Straightforward tools for everyone to create, structure, and use dashboards and reports on their own.
  items:
    - title: Interactive dashboards
      description: Build dashboards from saved questions and filters to track fast-moving KPIs like ARR, MAU, and NPS in a layout anyone can read. Metabase includes <a href="/features/drill-through">no-configuration drill-through</a> so people can explore categories, timelines, and details without setup, with optional custom click behaviors. Add Action buttons for simple CRUD operations.<br><a href="/docs/latest/dashboards/start">Learn more about dashboards in Metabase.</a>
      icon: /images/icons/filter.svg
    - title: Documents
      description: Combine visualizations and write explanations around insights to provide context, and make decisions without another meeting. Get <a href="/features/metabase-ai">Metabot</a> to create new visualizations or refine your analyses as you go. Collaborate asynchronously via comments - tag teammates to add charts, provide explanations, answer questions, or expand on the details.<br><a href="/docs/latest/documents/start">Learn more about Documents in Metabase.</a>
      icon: /images/icons/magnifying-glass.svg
    - title: Sharing data with your team and customers
      description: Share dashboards and Documents where people already work. Send direct links or PDF exports, <a href="/product/embedded-analytics">embed</a> them in your product or website, or schedule automated email and Slack updates - even for people without a Metabase login. Keep everyone aligned by delivering insights instead of making them hunt for them.<br><a href="/learn/metabase-basics/administration/administration-and-operation/guide-to-sharing-data">Learn more about sharing in Metabase.</a>
      icon: /images/icons/click.svg

- component: faq
  items:
    - question: "How do dashboards help teams make data-driven decisions?"
      answer: <p>Dashboards help teams make data-driven decisions by bringing key KPIs and metrics together in one place so you can see trends and changes at a glance. A well-designed dashboard gives immediate signal on what's working, what isn’t, and where you may need to step in or investigate further.</p>
    - question: "What's the best way to share a dashboard with non-technical teammates?"
      answer: <p>The best way to share a dashboard with non-technical teammates is to deliver it where they already work. Set up email or Slack subscriptions, share a direct link, export the dashboard as a PDF, or embed it in your intranet or product. These options make it easy for people to access insights without needing to log into Metabase.</p>
    - question: "Can I create data reports that tell a story, not just show charts?"
      answer: <p>Yes. Metabase Documents let you combine visualizations with written explanations so you can tell the story behind your data. This format helps you explain trends, add context, describe analysis steps, and make it easier for teams to understand and act on insights.</p>
    - question: "What's the difference between a dashboard and a data report"
      answer: <p>A dashboard gives a real-time overview of your KPIs and metrics in one place, making it easy to spot changes quickly and explore data with filters and drill-throughs. A data report, like a Metabase Document, is a point-in-time analysis with narrative context, explanations, and deeper insights. Dashboards show the <em>what</em>; reports explain the <em>why</em>.</p>
    - question: "How do i set up self-service analytics for my team?"
      answer: <p>Start by creating dashboards that highlight common questions and important metrics. Metabase includes built-in drill-throughs and filters, so teammates can explore data without setup. As people get familiar with the structure of your data, they can use Metabot or the query builder to ask their own questions and create dashboards and Documents to share with others.</p>
    - question: "How can I automate sharing dashboards and reports in Metabase?"
      answer: <p>You can automate dashboard sharing with scheduled email or Slack subscriptions on the cadence you choose. Dashboards update in real time and are designed to be checked regularly. Documents are more point-in-time, but you can still share them with PDF exports, public links, or by embedding them in your product or website.</p>

