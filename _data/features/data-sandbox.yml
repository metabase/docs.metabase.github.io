- component: hero
  title: Set strong boundaries around your data
  description: Show people what they need and nothing else. Get selective about data access with row- and column-level permissions for groups of people based on attributes you choose.
  badge:
    text: Data sandbox
    icon: /images/icons/badges/data-sandbox.svg
  ctas:
    - text: Get started
      href: https://store.metabase.com/checkout
    - text: Contact us
      href: /talk-to-a-person/
      extra-classes: btn-outline-blue
  video:
    id: data-sandbox
    poster: /images/features/sandbox.gif
    src: /images/features/data-sandbox.mp4

- component: cards
  title: Keep everyone in their own lane
  description: Make privacy a priority with these tools.
  items:
    - title: Basic sandbox
      description: Restrict rows for groups of people based on attributes you set. Create filtered views of a table so people only see what they need to, and nothing they don’t.
      icon: /images/icons/Sandbox.svg
    - title: Custom sandbox
      description: Restrict rows and columns for groups of people. You can display the results of a saved SQL question instead of the original table.
      icon: /images/icons/Sandbox2.svg
    - title: Set attributes
      description: Assign attributes manually or take a shortcut and do it programmatically with SSO or SAML for quick setup and easy maintenance.
      icon: /images/icons/Attributes.svg
    - title: For internal and customer-facing analytics
      description: Apply group attributes with basic or custom sandboxes for people within your company, or interactive embedding for secure multi-tenant analytics.
      icon: /images/icons/Analytics.svg
    - title: Connection impersonation
      description: Give a group access to the SQL editor while restricting the group's access to data based on a specific database role, centralizing permissions on the DB.
      icon: /images/icons/collections.svg
    - title: Display edited columns
      description: Show an edited or truncated version of the data. For example, instead of making email addresses available to everyone, you could just show display names.
      icon: /images/icons/Columns.svg

- component: list
  title: How to use drill-throughs on dashboards<br />and charts
  items:
    - description: Make sure users have an attribute to be grouped on (check out <b><a href="/docs/latest/permissions/data-sandboxes#prerequisites-for-basic-sandboxes">prerequisites for basic sandboxes</a></b>)
    - description: Go to <b>Admin settings > Permissions</b>.
    - description: Select the database and table that you want to sandbox.
    - description: Find the group that you want to put in the sandbox.
    - description: Click on the dropdown under <b>Data access</b> for that group.

