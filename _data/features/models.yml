- component: cards
  title: Make your data more usable and trustworthy
  description: Aggregate the most relevant bits of your data, tidy it up, and structure it for a simpler, safer jumping-off point for end-users to get answers than the Wild West of databases, tables, and schemas.
  items:
    - title: Add metadata and descriptions
      description: Give more context and signpost your data with more intuitive column names and descriptions to make it easier for end-users to interpret, and put together queries.
      icon: /images/icons/columns.svg
    - title: Easy to find
      description: Put models in the most obvious spot for people to find and use. Models get the VIP treatment by showing up higher in search results, and live in collections, or dashboards.
      icon: /images/icons/magnifying-glass.svg
    - title: Verify models
      description: Make sure people are using fresh, correct data. Highlight which models have been vetted by someone in the know with a blue tick to show it’s legit. (Available on <b><a href="/product/pro">Pro</a></b> and <b><a href="/product/enterprise">Enterprise</a></b>.)
      icon: /images/icons/medal.svg
    - title: Model caching
      description: Cache the results of models to keep things moving smoothly for your teammates.
      icon: /images/icons/speed.svg
    - title: Version history
      description: Keep track of how your model evolves to make sure it’s still accurate and relevant. View changes, revert to a previous version, and archive outdated versions.
      icon: /images/icons/click.svg
    - title: Model detail page
      description: See how your data is being used with a list of items using each model, fields in the model schema, and actions using the model.
      icon: /images/icons/model2.svg

- component: list
  title: How to create a model from scratch
  items:
    - description: In the upper right, click <b>New > Model</b>.
    - description: Choose either the query builder or a native query (if you want to use SQL). The advantage of using the query builder is that Metabase will be able to fill out some of the metadata for you; if you use SQL, you’ll have to fill out that metadata manually.
    - description: Select the data you want to include.
    - description: Tweak the metadata to make the model easier to use. Give columns clearer names, edit field names, and add descriptions.
    - description: Create and save your query.
    - description: Add your model to a collection or somewhere visible to your team and let them know it’s ready to use.
    - description: OR, create a model from a saved question by clicking the <b>…</b> menu and selecting <b>Turn into a model</b>.

