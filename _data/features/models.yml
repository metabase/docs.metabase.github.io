- component: faq
  items:
    - question: "What is a semantic layer?"
      answer: <p>A semantic layer is a shared map of your business logic for your analytics. It’s where you define the key models, metrics, and relationships that describe your data. The semantic layer gives your team a shared source of truth for important things they’ll need to reference often, like revenue, active users, or churn. It makes analytics consistent, reusable, and understandable, whether you’re writing queries, building dashboards, or asking an AI for help.</p>
    - question: "Why build your semantic layer in Metabase?"
      answer: <p>Metabase already powers your team’s analysis. Adding your semantic layer here means your definitions live where your questions are asked, without extra tools or duplication. Define models, metrics, and permissions once and reuse them everywhere for consistent, self-serve answers. Plus, your data becomes AI-ready — giving Metabot a reliable foundation for accurate responses.</p>
    - question: "How do models and metrics work in Metabase?"
      answer: <p>Models are curated datasets - clean, named queries that anyone can build on, with added metadata.</p><p>Metrics are reusable calculations (think common aggregations, like total revenue, conversion rate, or active users) you define once that everyone (including Metabot) can use for their own questions and queries to get consistent results.</p><p>You can (re)use models and metrics in questions, and soon transforms, so everyone’s working on the same definitions.</p>
    - question: "What are transforms? How are they different to models?"
      answer: <p>Transforms let you do the <a href="/learn/grow-your-data-skills/data-landscape/etl-landscape">T in ETL</a> - define data preparation logic, like cleaning, joining, or aggregating using SQL or Python.</p><p>Unlike models, which are reusable queries anyone can build, Transforms can write back to your database for faster performance and richer pipelines.</p><p>Together, they form a semantic layer, a shared vocabulary of your business logic that humans, AI, and tools alike, all understand.</p>
    - question: "How does the semantic layer help make Metabase AI-ready?"
      answer: <p>Metabot uses your semantic layer as context to answer questions accurately. It understands your models (curated tables), metrics (definitions), and transforms, so instead of guessing, it queries your defined logic.</p>
    - question: "Can I work in Python in Metabase?"
      answer: <p>Soon! Transforms will let you define reusable transformations in SQL or Python without leaving Metabase. It's designed for data shaping and logic, not full notebook-style scripting and machine learning, but if you want to use Python to prepare and define the data your team analyzes, transforms will hit the spot.</p>

