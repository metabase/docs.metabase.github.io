- component: try-metabase
  title: Try Metabase for free for 14 days
  description: Mary Poppins the heck out of your Metabase with collections,  <a class="d-inline blue-link-hover text-bold" href="/pricing/">available on all plans</a>. Make them official on Pro or Enterprise plans.
  cta:
    text: Get started
