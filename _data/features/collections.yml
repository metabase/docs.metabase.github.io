- component: hero
  title: Keep things organized
  description: Bring structure to your Metabase by tucking relevant models, questions, and dashboards together into collections, and make them easier find.<br /><br />Highlight important content and collections, and make them more accessible in search results.
  badge:
    text: Collections and verified items
    icon: /images/icons/badges/collections.svg
  cta:
    text: Get started
    href: https://store.metabase.com/checkout
  video:
    id: collections
    poster: /images/features/collections.png
    src: /images/features/collections.mp4

- component: cards
  title: Everything in its right place
  description: As everyone explores and adds more to your Metabase, things can get a little noisy. Keep it neat and in check with these tools.<br /><br />Your mom would be proud.
  items:
    - title: Collections
      description: Give each team their own little corner of Metabase. Bundle everything they need in a <b><a href="/docs/latest/exploration-and-organization/collections">collection</a></b> so they can keep track of what's happening and start exploring.
      icon: /images/icons/collections.svg
    - title: Collection permissions
      description: Give view access, curate access, or no access. You can even add sub-collections and give <b><a href="/docs/latest/exploration-and-organization/collections#collection-permissions">specific permissions</a></b> at each level.
      icon: /images/icons/eye.svg
    - title: Official collections
      description: Admins can <b><a href="/docs/latest/exploration-and-organization/collections#collection-types">mark collections as official</a></b> so people know they're vetted. These have a yellow badge and show up higher in suggestions and search results. (Available on <b><a href="/product/pro">Pro</a></b> and <b><a href="/product/enterprise">Enterprise</a></b>.)
      icon: /images/icons/medal.svg
    - title: Verified questions
      description: Rubber stamp questions and models with a <b><a href="/docs/latest/exploration-and-organization/content-verification">blue check mark</a></b> to show they've been moderated by someone in the know. Like official collections, these appear higher in suggestions and search results. (Available on <b><a href="/product/pro">Pro</a></b> and <b><a href="/product/enterprise">Enterprise</a></b>.)
      icon: /images/icons/question-blue.svg
    - title: Pin important items
      description: Keep dashboards, models, and questions <b><a href="/docs/latest/exploration-and-organization/collections#pinned-items">at the top of your collection</a></b>, so the most important stuff is right in front of people when people click in.
      icon: /images/icons/pin.svg
    - title: Personal collection
      description: Use it as your scratch pad for explorations. This space is <b><a href="/docs/latest/exploration-and-organization/collections#your-personal-collection">for your eyes only</a></b> (and your admin's, but y'know, they're not judging).
      icon: /images/icons/person.svg

- component: list
  title: How to create a collection, set permissions,<br /> and mark it as official
  items:
    - description: Create a new collection from scratch by clicking <b>New > Collection</b>. Add questions and dashboards into it.
    - description: OR, first create a new question. Click save, and select a collection to add it to, or scroll to the bottom of the menu and click <b>Create a collection</b>.
    - description: If you're admin, you can set and adjust permissions by user group from the top right <b>…</b> menu.
    - description: Admins on a <b><a href="/product/pro">Pro</a></b> or <b><a href="/product/enterprise">Enterprise</a></b> plan can mark the collection as Official from the <b>…</b> menu.

- component: ctas
  title: More about collections and verified items
  items:
