- component: hero
  title: Fine-grained control over what people can see and do with data
  description: Get granular governance over permissions for groups of people on your internal and embedded analytics, right down to the row and column level.
  badge:
    text: Permissions
    icon: /images/icons/badges/permissions.svg
  ctas:
    - text: Get started
      href: https://store.metabase.com/checkout
    - text: Contact us
      href: /talk-to-a-person/
      extra-classes: btn-outline-blue
  video:
    id: permissions
    poster: /images/features/permissions.png
    src: /images/features/data-sandbox.mp4

- component: cards
  title: From top secret to unrestricted access
  description: With several layers in between to choose from. Decide what people can see per database, table, schema, or data sandbox.
  items:
    - title: Manage permissions by group
      description: People can be in more than one group; when they’re in multiple groups the most permissive access applies. Map permissions with SSO (Available on <b><a href="/product/pro">Pro</a></b> and <b><a href="/product/enterprise">Enterprise</a></b>.)
      icon: /images/icons/person.svg
    - title: Row and column level permissions
      description: Use <b><a href="/features/data-sandbox">data sandboxes</a></b> to restrict access for certain groups down to the row or column level.
      icon: /images/icons/servers.svg
    - title: Database-managed row-level permissions
      description: Associate user attributes with database-defined roles and their privileges for impersonated access.
      icon: /images/icons/column.svg
    - title: Collection permissions
      description: Define which groups can view or edit items in a collection, like questions, dashboards, models, timelines, and events.
      icon: /images/icons/collections.svg
    - title: Application permissions
      description: Grant groups access to some, but not all, administrative features (Available on <b><a href="/product/pro">Pro</a></b> and <b><a href="/product/enterprise">Enterprise</a></b>.)
      icon: /images/icons/click.svg
    - title: Download results
      description: Determine whether users in a certain group can download results from a data source and how many rows (Available on <b><a href="/product/pro">Pro</a></b> and <b><a href="/product/enterprise">Enterprise</a></b>.)
      icon: /images/icons/share.svg

- component: ctas
  title: More info on drill-throughs and interactivity
  items:
    - badge: Documentation
      text: Introduction to permissions
      href: /docs/latest/permissions/introduction
    - badge: Documentation
      text: Data sandboxes
      href: /features/data-sandbox
    - badge: Learn
