  title: Try Metabase <br class="d-md-none"><span class="d-none d-md-inline">&nbsp;</span>14 days free
  description: Get full control over how your data is accessed and used on  <a class="d-inline blue-link-hover text-bold" href="/pricing/">all plans</a>.
  ctas:
    - text: Get started
      href: https://store.metabase.com/checkout
    - text: Contact us
      href: /talk-to-a-person/
      extra-classes: btn-outline-blue
