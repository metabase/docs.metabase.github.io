- component: hero
  title: White-label analytics for a seamless, branded reporting experience
  description: Enhance your SaaS app with fully branded, embedded white-label analytics. Customize dashboards, charts, and reports with no-code or advanced React SDK options.
  badge:
    text: White-label analytics
    icon: /images/icons/badges/white-labeled-analytics.svg
  ctas:
    - text: Get started
      href: https://store.metabase.com/checkout
    - text: Try the live demo
      href: /embedding-demo
      extra-classes: btn-outline-blue
  video:
    id: white-label-analytics
    poster: /images/features/white-label-analytics-analytics.png
    src: /images/features/white-label-analytics.mp4

- component: cards
  title: Key features of our white-labeled embedded analytics
  description: Customization that fits your white-labeled embedded analytics needs now, with developer tooling to keep up as your needs evolve.
  items:
    - title: Branded in-app reporting
      description: Customize the name, logo, fonts, and UI and chart colors and more of your embedded analytics. <a href="/docs/latest/configuring-metabase/appearance">See the full list of what you can white-label in our docs</a>.
      icon: /images/icons/Type=Trend.svg
    - title: Hide all traces of Metabase
      description: Add links to your own documentation, help settings, or background illustrations, or just hide default Metabase ones.
      icon: /images/icons/Type=Dashboard.svg
    - title: No-code customization
      description: Customize the look and feel of your white-label analytics via iframe—without needing developer resources.
      icon: /images/icons/model.svg
    - title: Go beyond white-labeling
      description: Use <a href="/product/embedded-analytics">Modular Embedding</a> or the <a href="/product/embedded-analytics-sdk">SDK</a> to embed individual React components that fit seamlessly in your product, with maximum control over the look and feel.
      icon: /images/icons/Type=Alert.svg
    - title: Dynamic theming
      description: Style each component with CSS variables so you can dynamically switch the look per organization, team, or even user with the <a href="/product/embedded-analytics-sdk">Modular Embedding SDK</a> for React.
      icon: /images/icons/Type=Dashboard.svg
    - title: Customized UX
      description: Override menu names, placement, and button names. Create intuitive click-paths that help people find what they need with the <a href="/product/embedded-analytics-sdk">Modular Embedding SDK</a> for React.
      icon: /images/icons/eye.svg

- component: list
  title: How to set up white-label analytics in your app
  items:
    - description: <b>Choose your white-labeling method.</b> Use Modular Embedding for quick implementation, or the <a href="/product/embedded-analytics-sdk">Modular Embedding SDK</a> for more in-depth customization.
    - description: <b>Customize your branding.</b> Add your company logo, colors, fonts, and custom UI elements.
    - description: <b>Define permissions.</b> Set up authentication to ensure only the right users see analytics inside your app.
    - description: <b>Refine the user experience.</b> With the SDK you can override menus, button placements, and tooltips to make analytics feel native.
    - description: <b>Deploy and iterate.</b> Test with internal users, gather feedback, and refine styling.

