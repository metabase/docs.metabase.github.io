- component: cards
  title: SQL queries with a few extra bells and whistles
  description: The flexibility and control you want from writing native queries, made a little cushier.
  items:
    - title: SQL parameters
      description: Create SQL templates by adding variables to your SQL queries. You can add filter widgets to modify the SQL query before it’s run for different results.
      icon: /images/icons/data.svg
    - title: SQL snippets
      description: Save, reuse, and share bits of SQL code to avoid rewriting the same thing. You can also organize snippets in folders and customize permissions (available on <b><a href="/product/pro">Pro</a></b> and <b><a href="/product/enterprise">Enterprise</a></b>.)
      icon: /images/icons/servers.svg
    - title: Dashboard filter
      description: Set up a SQL question to filter a dashboard, as long as it has one or more variable.
      icon: /images/icons/filter.svg
    - title: Autocomplete
      description: Write queries faster with autocomplete for keywords, tables, column names, and more.
      icon: /images/icons/xray.svg
    - title: Data reference
      description: Check the data reference in the sidebar for a quick refresher on the exact names of tables and columns as you’re writing a query.
      icon: /images/icons/columns.svg
    - title: Start from a model
      description: Use models as a jumping off point for asking more complex questions with a SQL query, with the benefit of vetted column definitions.
      icon: /images/icons/model.svg

- component: list
  title: How to ask a question with SQL
  items:
    - description: Click <b>New > SQL Query</b> at the top of Metabase. Note that you won’t see this option if you don’t have native query access. An admin can configure this for you if you need it.
    - description: Write your SQL query (if you’re using the SQL editor, you know what to do, don’t let us get in your way).
    - description: Click the ▶️ button to view results below.
    - description: To turn results into a chart, click <b>Visualization</b> and pick the best fit for your data. You can click around and see a preview below your query.
    - description: Save, add to a collection, a dashboard, share, live long and prosper, etc.

