# Top level is the use-case model
# Second level are the plans themselves
# This is needed because the feature descriptions differ in each
- slug: bi
  name: Business Intelligence
  tagline: Business Intelligence
  tooltip: I'm planning to use Metabase to help my team access data.
  icon: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"><path stroke="#509EE3" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.75 6.75a2 2 0 0 1 2-2h10.5a2 2 0 0 1 2 2v10.5a2 2 0 0 1-2 2H6.75a2 2 0 0 1-2-2V6.75ZM9.75 8.75V19M5 8.25h14"/></svg>'
  plans:
    - slug: oss
      name: Open Source
      intro: "Ideal for devs and small teams with their own infrastructure."
      customers:
        - name: Dribbble
          logo: dribble
        - name: Lago
          logo: lago
        - name: Dub
          logo: dub
        - name: myAgro
          logo: my-agro
      highlights-title: "Choose because your team needs easy-to-use business intelligence:"
      highlights:
        - text: 'Deploy the <span class="apply-tooltip" data-tippy-content="Let your team explore and work with data without needing SQL" data-tippy-placement="top"><a href="#analytics-dashboards">core Metabase BI experience</a></span> on your own servers'
          class: check
        - text: Unlimited queries, charts, and dashboards
          class: check
        - text: 'Embed <span class="apply-tooltip" data-tippy-content="Static embedding with iframes" data-tippy-placement="top"><a href="#static-embedding">basic dashboards and charts</a></span> with a “Powered by Metabase” badge'
          class: check
        - text: Connect to any <span class="apply-tooltip" data-tippy-content="Over 20 supported databases and data warehouses" data-tippy-placement="top"><a href="#20+-database-and-data-warehouse-connectors">supported data sources</a></span>
          class: check
      highlights-pricing-2026:
        - text: Ask questions with AI
        - text: SQL generation
        - text: 20+ supported data sources
        - text: Unlimited questions & dashboards
        - text: Write SQL or explore just by clicking
      color: yellow-40
      support: Community support forum
      deployment: Self-hosted deployment
      ai-service-available: false
      deployment-types:
        - Self-hosted
      ctas:
        - color: yellow
          label: Get installation instructions
          label-pricing-2026: Install
          url: /start/oss/

    - slug: starter
      name: Starter
      intro: A fully-supported and managed cloud-hosted instance of Metabase.
      customers:
        - name: Survicate
          logo: survicate
        - name: Primer
          logo: primer
        - name: Deepnote
          logo: deepnote
        - name: levels.fyi
          logo: levels-fyi
      highlights-title: "Choose because you want everything in <b>Open Source</b> plus:"
      highlights-title-pricing-2026: All Open Source features +
      highlights:
        - text: A fully-managed Metabase instance hosted in your region
          class: check
        - text: Automatic upgrades, patches, backups, and monitoring
          class: check
        - text: Fast, unlimited help from our team of experts
          class: check
      highlights-pricing-2026:
        - text: 5 users included
        - text: Automatic backups & upgrades
        - text: Pick your hosting region
        - text: 3-day support via email or chat
      color: green-40
      support: 3-day support via Slack, Teams, email
      deployment: Cloud deployment
      ai-service-available: true
      deployment-types:
        - Cloud

      ctas:
        - color: green
          label: Start free trial
          label-pricing-2026: Start trial
          url: https://store.metabase.com/checkout?plan=starter&use_case=bi

    - slug: pro
      name: Pro
      intro: Extra features helpful for managing lots of users and compliance.
      customers:
        - name: Huma
          logo: huma
        - name: Hugging Face
          logo: hugging-face
      highlights-title: "Choose because you want everything in <b>Starter</b> plus:"
      highlights-title-pricing-2026: All Starter features +
      highlights:
        - text: 'Granular data segregation with <span class="apply-tooltip" data-tippy-content="Set strong boundaries around your data" data-tippy-placement="top"><a href="#row--and-column-level-permissions-data-sandboxes">row- and column-level permissions</a></span> with support for <span class="apply-tooltip" data-tippy-content="Single sign-on options include SAML, LDAP or JWT" data-tippy-placement="top"><a href="#SAML">SSO</a></span> and <span class="apply-tooltip" data-tippy-content="Decouple authorization and provisioning" data-tippy-placement="top"><a href="#SCIM-account-provisioning">SCIM</a></span>'
          class: check
        - text: Advanced caching controls for faster, more responsive dashboards
          class: check
        - text: '<span class="apply-tooltip" data-tippy-content="Export and import content from your Metabase" data-tippy-placement="top"><a href="#serialization">Environment management</a></span> with separate staging and production setups'
          class: check
        - text: '<span class="apply-tooltip" data-tippy-content="A special collection offering total visibility into what’s going on in your instance" data-tippy-placement="top"><a href="#usage-analytics">Usage Analytics</a></span> for compliance and tracking behavior'
          class: check
        - text: '<span class="apply-tooltip" data-tippy-content="Metabase made to match your brand, including your logo, colors, and domain name." data-tippy-placement="top"><a href="#white-label-with-your-branding">White label</a></span> and customize to your brand—no "Powered by Metabase" badges'
          class: check
        - text: 'Also includes multi-tenant, customizable <span class="apply-tooltip" data-tippy-content="A fast and easy way to build in-app reporting for your customers with iframes or the React SDK" data-tippy-placement="top"><a href="#interactive-embedding">Embedded Analytics</a></span>'
          class: check
      highlights-pricing-2026:
        - text: 10 users included
        - text: Row and column level permissions
        - text: SSO
        - text: Caching controls 
        - text: Usage analytics & auditing
        - text: Multi-tenant embedded analytics
        - text: Whitelabel ready
      color: blue-40
      support: 3-day support via Slack, Teams, email
      deployment: Cloud or self-hosted deployment
      ai-service-available: true
      deployment-types:
        - Cloud
        - Self-hosted

      ctas:
        - color: blue
          label: Start free trial
          label-pricing-2026: Start trial
          url: https://store.metabase.com/checkout?plan=pro&use_case=bi

      embedding-pricing-2026:
        highlights-title: All BI features +
        highlights: 
          - text: Embed unlimited charts and dashboards with tailored interactivity
          - text: Let customers ask questions with AI
          - text: Multi tenant data segregation, including row- and column level security and granular permissions
          - text: Customize to your brand—no "Powered by Metabase" badges
          - text: And much more
            class: plus

    - slug: enterprise
      name: Enterprise
      intro: Extra help with procurement and access to professional services.
      customers:
        - name: Zalando
          logo: zalando
        - name: Coupa
          logo: coupa
        - name: Royal Bank of Canada
          logo: royal-bank-of-canada
        - name: Holland & Barrett
          logo: holland-and-barrett
      highlights-title: "Choose because you want everything in <b>Pro</b> plus:"
      highlights-title-pricing-2026: All Pro features +
      highlights:
        - text: Our help with your procurement process—no credit card required.
          class: check
        - text: A dedicated success engineer with a 1-day SLA
          class: check
        - text: Custom pricing, helpful with large instances with many users.
          class: check
        - text: 'Optional <span class="apply-tooltip" data-tippy-content="Run on-prem in ultra-secure and private environments" data-tippy-placement="top"><a href="#fully-air-gapped-deployment">air-gapping</a></span> or single-tenant hosting for enhanced data isolation'
          class: check
        - text: Optional access to additional <a href='/product/professional-services'>Professional Services</a>
          class: check
      highlights-pricing-2026:
        - text: Help with procurement
        - text: Dedicated success engineer
        - text: Air gap available
      color: purple-40
      support: 1-day support via Slack, Teams, email
      deployment: Cloud or self-hosted deployment
      ai-service-available: true
      deployment-types:
        - Cloud
        - Self-hosted

      ctas:
        - color: purple
          label: Talk to sales
          url: /sales/?plan=enterprise&use_case=bi

      embedding-pricing-2026:
        highlights-title: All Pro features +
        highlights:
          - text: Custom pricing aligned with your business model
          - text: Help with procurement
          - text: Dedicated success engineer
          - text: Air gap available

