    - v0.50
    - v0.51
    - v0.52
    - v0.53
    - v0.54
collections:
    docs: {output: true}
defaults:
    - {scope: {type: docs}, values: {layout: new-docs, permalink: '/:collection/:path'}}
java-minimum-version: 21
latest_version: v0.54.4
latest_enterprise: v1.54.4
docs_version: v0.54
release_branch: release-x.54.x
exclude:
    - '_docs/**/embedding/sdk/api/snippets/**'
    - svg-icon-list.html
    - Gemfile
    - Gemfile.lock
    - Gruntfile.js
    - webpack.config.js
    - node_modules
    - bower_components
    - .idea
    - .sass-cache
    - package.json
    - package-lock.json
    - yarn.lock
    - s3_website.template.yml
    - src
    - script
    - lib
    - spec
    - vendor
    - typescript
    - '**/*.map'
    - '**/*.LICENSE.txt'
per_incident_support: 350
STRIPE_PUBLISHABLE_API_KEY: pk_test_cW4xg5Kw7s6pIcxjaha5GJeP
