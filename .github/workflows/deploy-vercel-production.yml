name: Deploy production to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-docs-production
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  DEPLOY_ENV: production
  VERCEL_CLI_VERSION: "59.16.0"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_DOCS_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  docs:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install workspace packages
        run: bun install --frozen-lockfile
      - name: Test Vercel deployment tooling
        run: bun run test-vercel
      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Check Vercel project root
        run: bun tools/vercel/check-project.ts
      - name: Build docs production
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy docs production
        id: deploy
        run: bun tools/vercel/deploy.ts production
      - name: Check docs deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: bun tools/vercel/check-deployment.ts
