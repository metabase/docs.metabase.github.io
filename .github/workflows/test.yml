name: Test Docs Build

on:
  pull_request:
  push:
    branches:
      - "master"

jobs:
  test-build:
    name: Test Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install js dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Build the Docs Site
        env:
          NODE_ENV: production
        run: |
          # Clear the existing site:
          rm -rf _site
          # Build the docs site:
          script/build
