name: Clean up PR preview on Vercel

on:
  pull_request_target:
    branches: [master]
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-docs-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_DOCS_PROJECT_ID }}
      VERCEL_TEAM_SLUG: metaboat
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out trusted cleanup code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Remove preview alias and tagged deployments
        run: bun tools/vercel/cleanup-preview.ts
