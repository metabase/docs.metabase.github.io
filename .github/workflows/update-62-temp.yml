name: Update docs - 62
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

run-name: Nightly docs update - 62

jobs:
  update-docs:
    uses: ./.github/workflows/update-docs-base-bun.yml
    with:
      source_branch: "release-x.62.x"
      target_branch: "release-x.62.x"
      annotation: "nightly"
      run_name: "Nightly docs build - 62"
    secrets:
      METABASE_AUTOMATION_USER_TOKEN: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}
