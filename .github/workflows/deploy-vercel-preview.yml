name: Deploy PR preview to Vercel

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-docs-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  DEPLOY_ENV: staging
  GH_TOKEN: ${{ github.token }}
  VERCEL_CLI_VERSION: "59.16.0"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_DOCS_PROJECT_ID }}
  VERCEL_TEAM_SLUG: metaboat
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PR_BRANCH: ${{ github.head_ref }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  docs:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Check PR is still open and current
        run: bun tools/vercel/check-pull-request.ts
      - name: Update preview comment
        run: bun tools/vercel/update-preview-comment.ts building
      - name: Install workspace packages
        run: bun install --frozen-lockfile
      - name: Test Vercel deployment tooling
        run: bun run test-vercel
      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull preview settings
        run: vercel pull --yes --environment=preview --git-branch="$PR_BRANCH" --token="$VERCEL_TOKEN"
      - name: Check Vercel project root
        run: bun tools/vercel/check-project.ts
      - name: Build docs preview
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy docs preview
        id: deploy
        run: bun tools/vercel/deploy.ts preview
      - name: Publish stable preview URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: bun tools/vercel/publish-preview.ts
      - name: Report failed preview
        if: ${{ failure() }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: bun tools/vercel/update-preview-comment.ts failed
