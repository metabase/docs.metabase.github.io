name: Process Docs Changes
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      branch_name:
        type: string
        description: Which `metabase/metabase` branch to grab docs from
        message:
          required: true
  repository_dispatch:
    types: [trigger-workflow]

jobs:
  caught-new-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline
      - name: Update docs
        run: |
          ./script/docs-update
          ./script/docs master --set-version master
          tree _docs
