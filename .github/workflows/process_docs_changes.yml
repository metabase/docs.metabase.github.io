name: Process Docs Changes
on:
  # pull_request:
  #   branches:
  #     - master
  workflow_dispatch:
    inputs:
      branch_name:
        type: string
        description: Which `metabase/metabase` branch to grab docs from
        message:
          required: true

jobs:
  checkout-docs-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4

  show-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Display received payload
        run: |
          cat $GITHUB_EVENT_PATH
          echo "Received branch name: ${{ github.event.client_payload.branch }}"
