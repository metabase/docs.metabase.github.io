name: Process Docs Changes
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      branch_name:
        type: string
        description: Which `metabase/metabase` branch to grab docs from
        message:
          required: true
  repository_dispatch:
    types: [trigger-workflow]

jobs:
  checkout-docs-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4

  caught-new-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Babashka
        uses: turtlequeue/setup-babashka@v1.7.0
        with:
          babashka-version: 1.12.197
      - name: Check bb runs
        run: bb --version
      - name: Display branch name
        run: |
          echo "\nReceived branch name"
          echo $GITHB_EVENT_PATH | jq .inputs.branch_name
          # Add your workflow steps here based on the branch argument.
      - name: Pull branch content
        run: bb script/pull_docs_sources.clj
      - name: check _docs tree
        run: tree _docs
