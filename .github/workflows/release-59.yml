name: Update docs for 59
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

run-name: Nightly docs update | 59

jobs:
  update-docs:
    uses: ./.github/workflows/update-docs-base.yml
    with:
      source_branch: "release-x.59.x"
      target_branch: "release-x.59.x"
      annotation: "nightly"
      run_name: "Nightly docs build for 59"
    secrets:
      METABASE_AUTOMATION_USER_TOKEN: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}
