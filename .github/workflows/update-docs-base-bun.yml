name: Update Docs
run-name: >-
  ${{ github.event_name == 'schedule'
      && 'Nightly docs build'
      || format('Manual docs build - v{0}', inputs.major_versions) }}

on:
  # This triggers the auto docs build every night and uses the hard-coded DOC_VERSIONS
  schedule:
    - cron: "0 2 * * *"
  # This triggers a build of any set of numeric docs versions
  workflow_dispatch:
    inputs:
      major_versions:
        description: 'Comma separated major versions to pull docs from metabase/metabase release branches, eg. "63,62"'
        required: true
        type: string
        default: "999"

env:
  # Every version listed here is pulled in and published by a single nightly build.
  DOC_VERSIONS: "63,62"

concurrency:
  group: update-docs
  cancel-in-progress: true

jobs:
  params:
    name: Prep params
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.set-versions.outputs.versions }}
    steps:
      - name: Resolve and validate versions
        id: set-versions
        env:
          RAW_VERSIONS: ${{ inputs.major_versions || env.DOC_VERSIONS }}
        run: |
          versions="$(echo "$RAW_VERSIONS" | tr -d '[:space:]')"
          if ! echo "$versions" | grep -Eq '^[0-9]+(,[0-9]+)*$'; then
            echo "::error::Expected a comma separated list of major versions (eg. \"63,62\"), got: '$RAW_VERSIONS'"
            exit 1
          fi
          case ",$versions," in
            *,999,*)
              echo "::error::999 is the placeholder value - pick real major versions (eg. \"63,62\")."
              exit 1 ;;
          esac
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Building docs for versions: $versions"

  build:
    needs: params
    name: Build docs v${{ needs.params.outputs.versions }}
    runs-on: ubuntu-latest
    # The docs pull step retries and is capped at 90 minutes, so leave room for that
    # plus the astro build and htmlproofer.
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}
      DOC_VERSIONS: ${{ needs.params.outputs.versions }}
      # Every run gets its own branch, so nothing has to be merged by hand.
      BRANCH_NAME: docs-update-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - name: Prepare java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu" # See 'Supported distributions' for available options
          java-version: "21"

      - name: Install Clojure (needed to build cljs for SDK dox generation)
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: 1.12.0.1530
          bb: 1.12.200

      - name: Filter non-documented branches
        run: |
          for v in ${DOC_VERSIONS//,/ }; do
            bb script/check_incoming_branchname.clj --target-branch "release-x.$v.x"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install js dependencies
        run: bun install --frozen-lockfile

      # observed this failing during sdk docs generation deps downloads, so adding retry logic
      # note: a retry re-pulls every version, since the whole loop is the retried unit
      - name: Update docs for branchname
        timeout-minutes: 90
        run: |
          pull_docs() {
            for v in ${DOC_VERSIONS//,/ }; do
              echo "::group::Pulling docs from release-x.$v.x"
              bb script/update_docs_for_branchname.clj --source-branch "release-x.$v.x" --target-branch "release-x.$v.x"
              echo "::endgroup::"
            done
          }
          export -f pull_docs

          for attempt in 1 2 3; do
            echo "Pulling docs (attempt $attempt of 3)"
            status=0
            # the subshell restores `set -e`, so a failed version aborts the attempt
            bash -euo pipefail -c pull_docs || status=$?
            if (( status == 0 )); then exit 0; fi
            echo "::warning::Attempt $attempt failed (exit $status)"
            sleep 10
          done
          echo "::error::Docs pull failed after 3 attempts"
          exit 1

      - name: Cleanup cloud docs (move them to latest, remove from all other versions)
        run: |
          bb script/cleanup_cloud_docs.clj

      - name: Build the Docs Site
        env:
          NODE_ENV: production
        run: |
          # Clear the existing site:
          rm -rf _site
          # Build the docs site:
          script/build

      - name: Push the updated docs
        id: diff
        run: | # sh
          git config --global user.name "Metabase Automation User"
          git config --global user.email "metabase-bot@metabase.com"
          # The current docs version is also published to _docs/latest
          latest="$(sed -n 's/^docs_version: v0\.\([0-9]*\).*/\1/p' _config.yml)"
          for v in ${DOC_VERSIONS//,/ }; do
            git add "_docs/v0.$v" || echo "::warning::nothing to stage for _docs/v0.$v"
            if [[ "$v" == "$latest" ]]; then
              git add _docs/latest
            fi
          done

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No docs changes to commit."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git --no-pager diff --cached --stat

          git checkout -B "$BRANCH_NAME"
          git commit -m "Update docs for v$DOC_VERSIONS"
          git push --force origin "$BRANCH_NAME"

      - name: Open PR and enable automerge
        id: create_pr
        if: steps.diff.outputs.changed == 'true'
        run: | # sh
          {
            echo "Automated docs update, pulled from:"
            for v in ${DOC_VERSIONS//,/ }; do
              echo "- \`release-x.$v.x\`"
            done
          } > "$RUNNER_TEMP/pr-body.md"

          URL=$(gh pr create \
            --base master \
            --head "$BRANCH_NAME" \
            --title "Update docs: v0.${DOC_VERSIONS//,/, v0.}" \
            --body-file "$RUNNER_TEMP/pr-body.md")

          echo "pr_number=${URL##*/}" >> "$GITHUB_OUTPUT"
          gh pr merge --squash --auto "$URL"

      - name: Auto approve PR
        if: steps.diff.outputs.changed == 'true'
        env:
          # Must be GITHUB_TOKEN, not the job's PAT: the PAT opened the PR and
          # GitHub rejects self-approval.
          GH_TOKEN: ${{ github.token }}
        run: gh pr review "${{ steps.create_pr.outputs.pr_number }}" --approve
