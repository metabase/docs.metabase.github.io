name: Deploy docs to staging

# One-shot staging preview for this docs repo: builds the docs on the staging Amplify
# app and pushes both redirect layers so the whole /docs experience can be reviewed together:
#   1. Docs         — trigger an Amplify RELEASE build on the staging app and wait for it.
#   2. redirects.json — Amplify custom-rules (pattern redirects).
#   3. conditional-redirects.json — the version-conditional /docs CloudFront viewer-request
#      Function (generated by script/build-docs-redirect-fn.js), published to staging.
#
# Normally this is a manual button (workflow_dispatch). It is TEMPORARILY wired to
# pull_request so we can exercise it on this PR — see the trigger block below.
#
# Required repo config:
#   secrets.AMPLIFY_DEPLOY_ROLE_DEV — OIDC role with Amplify + CloudFront perms (staging)

on:
  # Intended trigger — re-enable this and delete the pull_request block once testing is done.
  # workflow_dispatch:
  #   inputs:
  #     branch:
  #       description: "docs branch to deploy to staging"
  #       required: true
  #       default: master
  pull_request: # TEMPORARY: lets us test the staging deploy on every PR update.
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-docs-staging
  cancel-in-progress: false

env:
  STAGING_APP_ID: dkkh35gceu2po
  FN_NAME: docs-version-redirects-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Resolve branch & validate redirect configs
        run: |
          set -euo pipefail
          BRANCH="${{ github.head_ref || github.event.inputs.branch || github.ref_name }}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "Deploying branch: $BRANCH"
          for f in redirects.json conditional-redirects.json; do
            if ! jq -e . "$f" > /dev/null; then
              echo "::error::Invalid JSON in $f"; exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate conditional-redirect function
        run: |
          set -euo pipefail
          node script/build-docs-redirect-fn.js \
            --config conditional-redirects.json \
            --out docs-redirect-fn.js
          SIZE=$(wc -c < docs-redirect-fn.js)
          echo "Function size: ${SIZE} bytes (CloudFront limit: 10240)"
          # Fail fast if we exceed the CloudFront Functions code-size limit.
          test "$SIZE" -le 10240

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AMPLIFY_DEPLOY_ROLE_DEV }}
          aws-region: us-east-1

      - name: Upload docs to staging (Amplify build)
        run: |
          set -euo pipefail
          ensure_built() {
            local app="$1" br="$2"
            if ! aws amplify get-branch --app-id "$app" --branch-name "$br" >/dev/null 2>&1; then
              echo "Creating Amplify branch $br on $app"
              aws amplify create-branch --app-id "$app" --branch-name "$br" >/dev/null
            fi
            local job
            job=$(aws amplify start-job --app-id "$app" --branch-name "$br" \
              --job-type RELEASE --query 'jobSummary.jobId' --output text)
            echo "Started job $job on $app/$br"
            for _ in $(seq 1 80); do
              local st
              st=$(aws amplify get-job --app-id "$app" --branch-name "$br" --job-id "$job" \
                --query 'job.summary.status' --output text)
              echo "  $app/$br: $st"
              case "$st" in
                SUCCEED) return 0 ;;
                FAILED|CANCELLED) echo "::error::Build $st for $app/$br"; return 1 ;;
              esac
              sleep 15
            done
            echo "::error::Timed out waiting for $app/$br"; return 1
          }
          ensure_built "$STAGING_APP_ID" "$BRANCH"

      - name: Deploy redirects.json (Amplify custom rules)
        run: |
          set -euo pipefail
          RULES=$(jq -c . redirects.json)
          aws amplify update-app --app-id "$STAGING_APP_ID" --custom-rules "$RULES"

      - name: Publish conditional-redirect CloudFront Function
        run: |
          set -euo pipefail
          COMMENT="Version-conditional /docs redirects (staging preview)"

          # Create on first run; otherwise update the DEVELOPMENT stage in place.
          # Both create/update return the fresh ETag, so capture it directly for publish.
          if ETAG=$(aws cloudfront describe-function --name "$FN_NAME" --stage DEVELOPMENT --query 'ETag' --output text 2>/dev/null); then
            ETAG=$(aws cloudfront update-function \
              --name "$FN_NAME" \
              --if-match "$ETAG" \
              --function-config "Comment=$COMMENT,Runtime=cloudfront-js-2.0" \
              --function-code fileb://docs-redirect-fn.js \
              --query 'ETag' --output text)
          else
            ETAG=$(aws cloudfront create-function \
              --name "$FN_NAME" \
              --function-config "Comment=$COMMENT,Runtime=cloudfront-js-2.0" \
              --function-code fileb://docs-redirect-fn.js \
              --query 'ETag' --output text)
          fi

          # Publish DEVELOPMENT → LIVE with the ETag returned by create/update.
          aws cloudfront publish-function --name "$FN_NAME" --if-match "$ETAG"

      - name: Summary
        run: |
          {
            echo "### Deployed docs to staging"
            echo ""
            echo "- Docs branch: \`$BRANCH\`"
            echo "- Amplify app: \`$STAGING_APP_ID\` (RELEASE build)"
            echo "- redirects.json: applied as Amplify custom rules"
            echo "- Redirect function: \`$FN_NAME\` (published)"
            echo ""
            echo "Preview: https://staging.metabase.com/"
            echo ""
            echo "> This workflow is temporarily on \`pull_request\`. Restore \`workflow_dispatch\` before merge."
          } >> "$GITHUB_STEP_SUMMARY"
