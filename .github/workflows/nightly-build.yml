name: Nightly build

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    name: Trigger Amplify build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the Amplify build hook
        env:
          AMPLIFY_BUILD_HOOK_URL: ${{ secrets.AMPLIFY_BUILD_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST -d '{}' "$AMPLIFY_BUILD_HOOK_URL"
