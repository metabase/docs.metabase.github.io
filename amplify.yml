version: 1
frontend:
  phases:
    preBuild:
      commands:
        - sudo yum install -y rsync
        - curl -fsSL https://bun.sh/install | bash
        - export PATH="$HOME/.bun/bin:$PATH"
        - bun ci
    build:
      commands:
        - export NODE_ENV=$([ "$AWS_BRANCH" = "master" ] && echo "production" || echo "staging") && bun run build
  artifacts:
    baseDirectory: _site
    files:
      - "**/*"
  cache:
    paths:
      - vendor/bundle/**/*
