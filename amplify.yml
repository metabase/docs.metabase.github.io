version: 1
frontend:
  phases:
    preBuild:
      commands:
        - sudo yum install -y rsync
        - curl -fsSL https://bun.sh/install | bash
        - export PATH="$HOME/.bun/bin:$PATH"
        - bun ci
    build:
      commands:
        - export NODE_ENV=$([ "$AWS_BRANCH" = "master" ] && echo "production" || echo "staging") && bun run build
        - mv node_modules ./.amplify-hosting/compute/default
  artifacts:
    # docs/[version]/[...slug] now renders on demand (astro-aws-amplify
    # adapter), so the deployable artifact is the adapter's compute+static
    # bundle, not the plain static `_site` output.
    baseDirectory: .amplify-hosting
    files:
      - "**/*"
  cache:
    paths:
      - vendor/bundle/**/*
