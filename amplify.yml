version: 1
frontend:
  phases:
    preBuild:
      commands:
        - sudo yum install -y xz
        - rvm install 3.3.2
        - rvm use 3.3.2
        - gem install bundler -v 2.5.22
        - bundle _2.5.22_ config set --local path 'vendor/bundle'
        - bundle _2.5.22_ install
    build:
      commands:
        - JEKYLL_ENV=production NODE_ENV=production bundle _2.5.22_ exec jekyll build
  artifacts:
    baseDirectory: _site
    files:
      - "**/*"
  cache:
    paths:
      - vendor/bundle/**/*
