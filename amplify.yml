version: 1
frontend:
  phases:
    preBuild:
      commands:
        - sudo yum install -y rsync jq
        - curl -fsSL https://bun.sh/install | bash
        - export PATH="$HOME/.bun/bin:$PATH"
        - bun ci
        - bash script/worktree-docs-history.sh
    build:
      commands:
        - export NODE_ENV=$([ "$AWS_BRANCH" = "master" ] && echo "production" || echo "staging") && bun run build
    postBuild:
      commands:
        - |
          if [ "$AWS_BRANCH" = "master" ]; then
            for dir in _site/docs/v0.*/; do
              version=$(basename "$dir")
              aws s3 sync "$dir" "s3://metabase-docs-archive-488208231899-us-east-1-an/$version/" --delete
            done
          fi
  artifacts:
    baseDirectory: _site
    files:
      - "**/*"
  cache:
    paths:
      - vendor/bundle/**/*
